# Live config for /etc/nginx/sites-available/sit.jasonbenn.com — keep in sync when editing.
# Apply: sudo cp /opt/sit/nginx-config.conf /etc/nginx/sites-available/sit.jasonbenn.com
#        sudo nginx -t && sudo systemctl reload nginx

server {
    server_name sit.jasonbenn.com;
    client_max_body_size 50M;

    # Morning dashboard is tailnet-only (via tailscale serve :8445); never expose it publicly.
    location ~ ^/(morning|api/morning) {
        return 404;
    }

    location / {
        proxy_pass http://localhost:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sit.jasonbenn.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sit.jasonbenn.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = sit.jasonbenn.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name sit.jasonbenn.com;
    listen 80;
    return 404; # managed by Certbot
}
