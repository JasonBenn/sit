<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sit</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#FAF7F1">
<style>
  :root {
    --ink: #2A2723;
    --ink-soft: #55503F;
    --ink-faded: #877F72;
    --paper: #FAF7F1;
    --paper-raised: #F3EEE3;
    --hairline: #E4DDCE;
    --hairline-strong: #CFC6B2;
    --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --sans: 'Outfit', -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    font-weight: 300;
    overflow: hidden;  /* only the interior panes scroll, never the page */
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    max-width: 1280px;
    /* dvh = the *visible* viewport: on tablet browsers 100vh includes the area
       behind the browser chrome, which pushed the composer off screen */
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
  }

  .divider { background: var(--hairline-strong); }

  /* ————— left: conversation ————— */

  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  .pane-header {
    position: relative;   /* anchors the history calendar popover */
    padding: 28px 40px 18px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .pane-header h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .pane-header .sub {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
  }

  .session-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .session-nav .pager {
    font-size: 13px;
    color: var(--ink-faded);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .session-nav button {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 5px 12px;
    cursor: pointer;
  }

  button:disabled { opacity: 0.35; cursor: default; }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 28px 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .msg { max-width: 92%; }

  .msg .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin-bottom: 6px;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 14px 18px;
  }

  .msg.assistant { align-self: flex-start; }

  .msg p + p { margin-top: 10px; }

  .msg a, .tool a, .entry a {
    color: var(--ink-soft);
    text-decoration: underline;
    text-decoration-color: var(--hairline-strong);
    text-underline-offset: 2px;
    overflow-wrap: anywhere;
  }

  .msg .pending { color: var(--ink-faded); letter-spacing: 0.2em; }

  .notice {
    align-self: flex-start;
    font-size: 14px;
    font-style: italic;
    color: var(--ink-faded);
  }

  /* tool call chips */
  .tool {
    align-self: flex-start;
    border-left: 2px solid var(--hairline-strong);
    padding: 6px 0 6px 16px;
    max-width: 92%;
  }

  .tool .tool-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
  }

  .tool .tool-body {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 3px;
  }

  /* sit row: duration chips + routine + add-sit, above the composer */
  .sit-row {
    position: relative;   /* anchors the routine popover */
    border-top: 1px solid var(--hairline);
    padding: 12px 40px 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;      /* never overflow the pane — add-sit drops to its own line */
    gap: 10px 12px;
  }

  .sit-row .sit-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin-right: 4px;
  }

  .sit-row .durations { display: flex; flex-wrap: wrap; gap: 8px; }

  /* a fixed-length guided sit sets its own length — the chips step aside for it */
  .sit-row .sit-fixed {
    display: none;
    align-items: center;
    height: 40px;
    padding: 0 15px;
    font-size: 15px;
    color: var(--ink-soft);
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    font-variant-numeric: tabular-nums;
  }

  .sit-row.fixed-length .durations { display: none; }
  .sit-row.fixed-length .sit-fixed { display: flex; }

  /* the label ellipsizes in an inner span — a button box won't do it itself */
  .sit-row .routine-btn {
    display: inline-flex;
    align-items: center;
    max-width: 230px;
  }

  .sit-row .routine-btn span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sit-row .routine-btn.open { border-color: var(--ink); color: var(--ink); }

  /* routine popover — opens upward, the sit row sits near the bottom */
  .routine-panel {
    position: absolute;
    bottom: calc(100% + 1px);
    left: 40px;
    z-index: 6;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 14px 18px 12px;
    width: 330px;
    max-height: 52vh;
    overflow-y: auto;
  }

  .rp-group + .rp-group { margin-top: 15px; }

  .rp-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin-bottom: 6px;
  }

  .rp-opt {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 4px 0;
    cursor: pointer;
  }

  .rp-opt input { accent-color: var(--ink); margin: 0; }

  .rp-opt .rp-len {
    margin-left: auto;
    padding-left: 10px;
    font-size: 11.5px;
    color: var(--ink-faded);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* proposed routine: a tool message the model can hand you to start */
  .tool.proposal {
    border-left: none;
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 14px 18px;
  }

  .tool.proposal .tool-body {
    font-style: normal;
    font-size: 15px;
    color: var(--ink);
  }

  .tool.proposal .chip { margin-top: 12px; }

  /* guided meditation options: one row per recording, a play chip at the right */
  .tool.options {
    align-self: stretch;
    max-width: none;
    border-left: none;
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 14px 18px;
  }

  .tool.options .none {
    font-size: 15px;
    color: var(--ink);
    margin-top: 10px;
  }

  .tool.options .choice {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 11px 0;
    border-top: 1px solid var(--hairline);
  }

  /* hairlines separate rows; nothing above the first or below the last */
  .tool.options .choice:first-of-type { border-top: none; margin-top: 10px; }

  /* the text column ellipsizes; the chip keeps its width whatever the title */
  .tool.options .choice .meta { flex: 1; min-width: 0; }

  /* three steps of one ramp: name, then the facts, then the aside */
  .tool.options .choice .title {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.35;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tool.options .choice .sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .tool.options .choice .why {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-faded);
    font-style: italic;
    margin-top: 5px;
  }

  /* a fixed column, so the chips line up however long the names run */
  .tool.options .choice .chip {
    flex: none;
    width: 100px;
    margin-top: 0;
    padding: 0;
    text-align: center;
    white-space: nowrap;
  }

  /* state is a filled chip, never colour alone — the DC-1 is grayscale */
  .tool.options .choice .chip.playing {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* heard already: still legible, plainly spent */
  .tool.options .choice .chip.played {
    color: var(--ink-faded);
    border-color: var(--hairline);
  }

  /* notebook answer: full width, collapsed to a preview until expanded */
  .tool.notebook { align-self: stretch; max-width: none; }

  .tool.notebook .answer {
    position: relative;
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
  }

  .tool.notebook.collapsed .answer {
    max-height: 5.2em;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 55%, transparent);
    mask-image: linear-gradient(#000 55%, transparent);
  }

  .tool.notebook .answer p, .tool.notebook .answer ul, .tool.notebook .answer ol { margin: 0 0 10px; }
  .tool.notebook .answer ul, .tool.notebook .answer ol { padding-left: 22px; }
  .tool.notebook .answer li { margin-bottom: 4px; }
  .tool.notebook .answer strong { font-weight: 500; }
  .tool.notebook.pending .waiting {
    margin-top: 6px; font-size: 13px; font-style: italic; opacity: 0.7;
  }
  .tool.notebook.pending .waiting::before {
    content: '⋯'; margin-right: 6px; animation: nb-pulse 1.4s ease-in-out infinite;
  }
  @keyframes nb-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .tool.notebook .answer .md-h {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }

  .tool.notebook .toggle {
    background: none;
    border: none;
    padding: 4px 0 0;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faded);
    cursor: pointer;
  }
  .tool.notebook .toggle:hover { color: var(--ink); }

  .sit-row .add-sit {
    margin-left: auto;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    height: 40px;
    padding: 0 16px;
    cursor: pointer;
  }

  /* sit marker: the widget pinned into the conversation when a sit is logged */
  .sit-marker {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 4px 0;
  }

  .sit-marker::before, .sit-marker::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--hairline-strong);
  }

  .sit-marker .sit-mins {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
  }

  .sit-marker .sit-timer {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 5px 12px;
    cursor: pointer;
  }

  /* every control in the row is exactly 40px tall — buttons and the number
     input compute height differently from padding, so fix it outright */
  .chip {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    height: 40px;
    padding: 0 15px;
    cursor: pointer;
  }

  .chip.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .chip-custom {
    width: 54px;
    padding: 0;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .chip-custom::-webkit-outer-spin-button,
  .chip-custom::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .chip-custom::placeholder { color: var(--ink-faded); }

  .chip-custom.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* sit history calendar */
  .history-panel {
    position: absolute;
    top: calc(100% + 1px);
    right: 40px;
    z-index: 5;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 16px 18px 12px;
    width: 292px;
  }

  .cal-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .cal-head .cal-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
  }

  .cal-head button {
    font-size: 15px;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 0 8px;
    cursor: pointer;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-grid .dow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faded);
    text-align: center;
    padding: 3px 0 5px;
  }

  .cal-grid .day {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    text-align: center;
    line-height: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--sans);
    font-weight: 300;
  }

  .cal-grid .day:hover { background: var(--paper-raised); }

  .cal-grid .day.sat {
    background: var(--ink);
    color: var(--paper);
  }

  /* e-ink legible: today is a thick ring; a sat today keeps the fill and
     gains an inner paper ring so it reads distinctly from other sat days */
  .cal-grid .day.today {
    box-shadow: inset 0 0 0 2px var(--ink);
    font-weight: 500;
  }

  .cal-grid .day.sat.today {
    box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px var(--paper);
  }

  .cal-grid .day.future {
    color: var(--hairline-strong);
    pointer-events: none;
  }

  .cal-hint {
    font-size: 11px;
    color: var(--ink-faded);
    margin-top: 10px;
    text-align: center;
  }

  /* guided player: a docked row between the chat and the sit row, hidden
     until a recording is loaded. Not the runner — no bells, no countdown. */
  .player {
    display: none;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--hairline);
    background: var(--paper);
    padding: 10px 40px;
    /* how much of the track is behind the thumb; paintPlayer keeps it current */
    --pl-pct: 0%;
  }

  .player.on { display: flex; }

  /* same box as .chip, so the transport reads as one family with the sit row */
  .player .pl-btn {
    flex: none;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 400;
    line-height: 1;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    height: 40px;
    min-width: 40px;
    padding: 0 9px;
    cursor: pointer;
  }

  /* fixed width: the glyph swaps play/pause without nudging the row */
  .player .pl-play { width: 44px; padding: 0; color: var(--ink); font-size: 13px; }
  .player .pl-close { width: 40px; padding: 0; font-size: 18px; }

  .player .pl-title {
    flex: 0 1 200px;
    min-width: 90px;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* the scrubber takes whatever the rest of the row leaves. The input is the
     full row height, so the thumb has a finger-sized hit area either side. */
  .player .pl-seek {
    flex: 1 1 140px;
    min-width: 104px;
    height: 40px;
    background: none;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  /* elapsed is solid ink against a hairline remainder — readable with no hue */
  .player .pl-seek::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(to right,
      var(--ink) 0 var(--pl-pct), var(--hairline-strong) var(--pl-pct) 100%);
  }

  .player .pl-seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    margin-top: -8.5px;
    border: none;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 0 3px var(--paper);
  }

  .player .pl-seek::-moz-range-track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(to right,
      var(--ink) 0 var(--pl-pct), var(--hairline-strong) var(--pl-pct) 100%);
  }

  .player .pl-seek::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 0 3px var(--paper);
  }

  /* tabular figures, and a floor wide enough that 9:59 -> 10:00 moves nothing */
  .player .pl-time {
    flex: none;
    min-width: 78px;
    text-align: right;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* a file that would not load has no timeline to show, and nothing to skip
     through — the row gives the whole width to saying so */
  .player.failed .pl-seek,
  .player.failed .pl-time,
  .player.failed .pl-skip { display: none; }

  .player.failed .pl-title {
    flex: 1 1 auto;
    color: var(--ink-faded);
    font-style: italic;
  }

  /* composer (the sit row above it carries the separating border) */
  .composer {
    padding: 14px 40px 24px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
  }

  /* textarea (1 line) and button are both 36px tall, so flex-end lines them up */
  .composer textarea {
    flex: 1;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 300;
    color: var(--ink);
    background: none;
    border: none;
    outline: none;
    resize: none;
    line-height: 1.5;
    padding: 6px 0;
    max-height: 40vh;
    overflow-y: auto;
  }

  .composer textarea::placeholder { color: var(--ink-faded); }

  .composer .send {
    font-size: 13px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 9px 18px;
    cursor: pointer;
  }

  /* ————— right: wake-up log ————— */

  .log-wrap {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .log-scroll {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 28px 28px 40px 40px;
  }

  .entry li, .entry p { overflow-wrap: anywhere; }

  /* outline rail */
  .outline {
    width: 208px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 22px 18px 40px 16px;
    border-left: 1px solid var(--hairline);
    scrollbar-width: thin;
  }

  .outline a {
    display: block;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink-faded);
    text-decoration: none;
    padding: 4px 0;
    cursor: pointer;
  }

  .outline a .odate {
    font-variant-numeric: tabular-nums;
    margin-right: 5px;
  }

  .outline a:hover { color: var(--ink-soft); }
  .outline a.active { color: var(--ink); }

  .log-wrap.outline-hidden .outline { display: none; }

  .outline-toggle {
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 4px 10px;
    cursor: pointer;
  }

  .outline-toggle.on {
    color: var(--ink-soft);
    border-color: var(--hairline-strong);
  }

  .entry { padding: 22px 0; border-bottom: 1px solid var(--hairline); }
  .entry:first-child { padding-top: 4px; }

  .entry .date {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-faded);
    margin-bottom: 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .entry .fresh {
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 1px 8px;
    font-size: 10px;
  }

  .entry h2 {
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 500;
    line-height: 1.25;
    margin-bottom: 10px;
    text-wrap: balance;
  }

  .entry ul { list-style: none; }

  .entry li {
    font-size: 15px;
    color: var(--ink-soft);
    padding-left: 26px;
    position: relative;
    margin-bottom: 7px;
  }

  .entry li .marker {
    position: absolute;
    left: 0;
    color: var(--ink-faded);
    font-variant-numeric: tabular-nums;
  }

  .entry li.done { color: var(--ink-faded); }
  .entry li.done .item-text { text-decoration: line-through; }

  .entry p {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  .entry li strong, .entry p strong { font-weight: 500; color: var(--ink); }

  .log-scroll .notice { display: block; padding-top: 4px; }

  .load-more {
    display: block;
    margin: 20px auto 0;
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 8px 16px;
    cursor: pointer;
  }

  /* ————— runner overlay: table of contents + stage + controls ————— */

  .timer-overlay {
    position: fixed;
    top: 0; left: 0; right: 0;
    /* dvh, not inset:0 — the large viewport puts the controls behind iOS
       Safari's toolbar, the same reason .app sizes itself this way */
    height: 100vh;
    height: 100dvh;
    background: var(--paper);
    display: none;
    z-index: 10;
  }

  .timer-overlay.on {
    display: grid;
    grid-template-columns: 264px 1fr;
  }

  .runner-toc {
    border-right: 1px solid var(--hairline);
    overflow-y: auto;
    padding: 30px 22px 40px;
    scrollbar-width: thin;
  }

  /* One step list, two homes: the proposed-routine card and the runner TOC.
     Same markup either way; `static` is the non-interactive card variant. */
  .steplist-comp {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin: 20px 0 8px;
  }

  .steplist-comp:first-child { margin-top: 0; }

  .steplist-cite {
    font-size: 11px;
    font-style: italic;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-faded);
    margin: -4px 0 8px;
  }

  .steplist-step {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    text-align: left;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 300;
    line-height: 1.4;
    color: var(--ink-faded);
    background: none;
    border: none;
    padding: 4px 0;
    cursor: pointer;
  }

  .steplist-dur {
    flex: none;
    font-variant-numeric: tabular-nums;
    opacity: 0.7;
  }

  .steplist.static .steplist-step { color: var(--ink); cursor: default; }
  .steplist-step.current { color: var(--ink); font-weight: 500; }
  .steplist-step.done { color: var(--hairline-strong); }

  /* under 900px the TOC collapses behind this counter */
  .toc-toggle {
    display: none;
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    left: 16px;
    z-index: 3;
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faded);
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .runner-main {
    display: grid;
    grid-template-rows: 1fr auto auto;
    min-width: 0;
    min-height: 0;
  }

  .runner-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: safe center;  /* a tall step scrolls instead of clipping its top */
    gap: 22px;
    padding: 32px 40px;
    overflow-y: auto;
    min-height: 0;
    cursor: pointer;   /* tapping the stage pauses and resumes */
  }

  .runner-media:empty { display: none; }

  .runner-media img {
    display: block;
    max-height: 40vh;
    max-width: 100%;
    object-fit: contain;
  }

  .runner-media audio, .runner-media video {
    max-width: min(100%, 560px);
    max-height: 40vh;
  }

  .runner-title {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    line-height: 1.2;
    text-align: center;
    text-wrap: balance;
  }

  .runner-title:empty { display: none; }

  .runner-text {
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 560px;
    text-align: center;
  }

  .runner-text:empty { display: none; }

  .timer-overlay .countdown {
    font-family: var(--serif);
    font-size: 96px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  /* the seated step keeps the old full-bleed look */
  .runner-main.sit-step .countdown { font-size: 190px; }

  /* A step's own guidance and the generated intention are the same slot: a step
     that carries its own text never also gets a generated line. */
  .runner-text.generated {
    font-family: var(--serif);
    font-style: italic;
    font-size: 24px;
    max-width: 560px;
    text-wrap: balance;
    white-space: pre-line;  /* the model separates sit phases with newlines */
  }

  .timer-overlay .hint {
    text-align: center;
    padding: 0 20px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-faded);
  }

  .runner-controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0 20px calc(24px + env(safe-area-inset-bottom));
  }

  .runner-controls button {
    font-family: var(--sans);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 9px 15px;
    cursor: pointer;
  }

  /* ————— mobile: one pane at a time, tabs to switch ————— */

  .mobile-tabs { display: none; }

  @media (max-width: 900px) {
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    .divider { display: none; }

    .mobile-tabs {
      display: flex;
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--hairline);
    }

    .mobile-tabs button {
      flex: 1;
      font-family: var(--sans);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-faded);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 13px 0 11px;
      cursor: pointer;
    }

    .mobile-tabs button.active {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .pane { flex: 1; }
    .app.show-log .pane:first-of-type { display: none; }
    .app:not(.show-log) .pane:last-of-type { display: none; }

    /* the tab bar already names the log; its header is redundant */
    .pane:last-of-type .pane-header { display: none; }

    .pane-header {
      padding: 16px 20px 12px;
      flex-wrap: wrap;
      gap: 6px 12px;
    }

    .pane-header h1 { font-size: 24px; }

    .sit-row { padding: 10px 20px 0; }

    .chip { padding: 0 12px; }

    .chip-custom { font-size: 16px; } /* <16px inputs trigger iOS zoom-on-focus */

    .history-panel {
      left: 20px;
      right: 20px;
      width: auto;
    }

    .chat-scroll { padding: 20px; gap: 18px; }

    .player { padding: 9px 20px; gap: 8px; }
    .player .pl-title { flex: 0 1 150px; min-width: 70px; }

    .composer {
      padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
    }

    .log-scroll { padding: 20px 20px 40px; }

    /* the outline becomes a right tray over the log — swipe left to open, right to close */
    .outline-toggle { display: none; }
    .log-wrap { position: relative; overflow: hidden; }
    .log-wrap.outline-hidden .outline { display: block; }
    .outline {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: min(78vw, 300px);
      background: var(--paper);
      box-shadow: -10px 0 22px rgba(0, 0, 0, 0.07);
      transform: translateX(102%);
      transition: transform 0.22s ease;
    }
    .log-wrap.outline-open .outline { transform: translateX(0); }

    /* leave room for add-sit on the same line */
    .sit-row .routine-btn { max-width: 150px; }
    .routine-panel { left: 20px; right: 20px; width: auto; }

    /* the TOC becomes a sheet over the stage */
    .timer-overlay.on { grid-template-columns: 1fr; }
    .toc-toggle { display: block; }
    .runner-toc {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--paper);
      border-right: none;
      padding: calc(58px + env(safe-area-inset-top)) 20px 40px;
    }
    .runner-toc.open { display: block; }

    .runner-stage { padding: 24px 20px; gap: 18px; }
    /* on a phone the countdown leads — an image, a title and a paragraph above
       it push it past the fold, and it's the one thing that must always show */
    .runner-stage .countdown { order: -1; }
    .runner-media img { max-height: 30vh; }
    .runner-title { font-size: 25px; }
    .timer-overlay .countdown { font-size: min(96px, 22vw); }
    .runner-main.sit-step .countdown { font-size: min(150px, 26vw); }
    .runner-text.generated { font-size: 20px; padding: 0 24px; }
  }

  /* narrow: the clock goes, the scrubber takes the row */
  @media (max-width: 600px) {
    .player .pl-time { display: none; }
    .player .pl-title { flex: 0 1 130px; min-width: 60px; }
    .player { gap: 7px; }
    .player .pl-btn { padding: 0 7px; min-width: 38px; }
    .player .pl-play { width: 40px; }
  }
</style>
</head>
<body>

<div class="app">

  <nav class="mobile-tabs">
    <button class="active" data-view="chat">Check in</button>
    <button data-view="log">Wake up log</button>
  </nav>

  <!-- ——— LEFT: conversation ——— -->
  <section class="pane">
    <header class="pane-header">
      <h1 id="today"></h1>
      <div class="session-nav">
        <button id="prev" title="Previous session">‹</button>
        <span class="pager" id="pager"></span>
        <button id="next" title="Next session">›</button>
        <button id="new-session">New</button>
        <button id="history-btn" title="Sit history — tap a day to backfill">history</button>
      </div>

      <div class="history-panel" id="history-panel" hidden>
        <div class="cal-head">
          <button id="cal-prev" title="Previous month">‹</button>
          <span class="cal-title" id="cal-title"></span>
          <button id="cal-next" title="Next month">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-hint">tap a day to toggle a sit — uses the selected duration</div>
      </div>
    </header>

    <div class="chat-scroll" id="chat"></div>

    <div class="player" id="player">
      <button class="pl-btn pl-play" id="pl-play" title="Play or pause">▶</button>
      <span class="pl-title" id="pl-title"></span>
      <button class="pl-btn pl-skip" id="pl-back" title="Back 15 seconds">−15</button>
      <button class="pl-btn pl-skip" id="pl-fwd" title="Forward 15 seconds">+15</button>
      <input class="pl-seek" id="pl-seek" type="range" min="0" max="0" value="0" step="1" title="Scrub">
      <span class="pl-time" id="pl-time">0:00 / 0:00</span>
      <button class="pl-btn pl-close" id="pl-close" title="Unload this recording">×</button>
      <audio id="pl-audio" preload="metadata"></audio>
    </div>

    <div class="sit-row">
      <span class="sit-label">Sat for</span>
      <div class="durations" id="durations">
        <button class="chip">5</button>
        <button class="chip">10</button>
        <button class="chip">20</button>
        <button class="chip selected">30</button>
        <button class="chip">40</button>
        <input class="chip chip-custom" id="custom-min" type="number" min="1" max="600" placeholder="…">
      </div>
      <span class="sit-fixed" id="sit-fixed"></span>
      <button class="chip routine-btn" id="routine-btn" title="Choose the warm-up and the sit"><span>just sit</span></button>
      <button class="add-sit" id="add-sit" title="Log this sit into the conversation">+ Add sit</button>

      <div class="routine-panel" id="routine-panel" hidden>
        <div class="rp-group">
          <div class="rp-title">Before the sit</div>
          <div id="rp-warmups"></div>
        </div>
        <div class="rp-group">
          <div class="rp-title">The sit</div>
          <div id="rp-sits"></div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Check in…"></textarea>
      <button class="send" id="send">Send</button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- ——— RIGHT: wake-up log ——— -->
  <section class="pane">
    <header class="pane-header">
      <h1>Wake up log</h1>
      <button class="outline-toggle" id="outline-toggle" title="Show or hide the outline">outline</button>
    </header>

    <div class="log-wrap">
      <div class="log-scroll" id="journal"></div>
      <nav class="outline" id="outline"></nav>
    </div>
  </section>
</div>

<div class="timer-overlay" id="overlay">
  <button class="toc-toggle" id="toc-toggle">1 / 1</button>
  <nav class="runner-toc" id="runner-toc"></nav>
  <div class="runner-main" id="runner-main">
    <div class="runner-stage" id="runner-stage">
      <div class="runner-media" id="runner-media"></div>
      <div class="runner-title" id="runner-title"></div>
      <div class="runner-text" id="runner-text"></div>
      <div class="countdown" id="countdown">30:00</div>
    </div>
    <div class="hint" id="runner-hint">tap the center to pause</div>
    <div class="runner-controls">
      <button id="rn-prev" title="Previous step">‹ prev</button>
      <button id="rn-pause" title="Pause or resume">pause</button>
      <button id="rn-next" title="Next step">next ›</button>
      <button id="rn-end" title="Back to the conversation">end</button>
    </div>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const journalPane = document.getElementById('journal');
  const outlinePane = document.getElementById('outline');
  const pager = document.getElementById('pager');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const newBtn = document.getElementById('new-session');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const addSitBtn = document.getElementById('add-sit');
  const overlay = document.getElementById('overlay');
  const countdown = document.getElementById('countdown');
  const runnerMain = document.getElementById('runner-main');
  const runnerStage = document.getElementById('runner-stage');
  const runnerToc = document.getElementById('runner-toc');
  const runnerMedia = document.getElementById('runner-media');
  const runnerTitle = document.getElementById('runner-title');
  const runnerText = document.getElementById('runner-text');
  const runnerHint = document.getElementById('runner-hint');
  const tocToggle = document.getElementById('toc-toggle');
  const pauseBtn = document.getElementById('rn-pause');

  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

  const DEFAULT_SIT_SLUG = 'unguided-sit';

  let sitMinutes = 30;      // what Add sit posts
  let chosenMinutes = 30;   // what the user picked; a fixed-length sit overrides it
  let sessions = [];
  let index = -1;
  let messages = [];
  let busy = false;
  let components = [];                                        // the practice library
  let routine = { warmup_slugs: [], sit_slug: DEFAULT_SIT_SLUG };

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return res.json();
  }

  function postJSON(path, body) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  /* ————— rendering ————— */

  const URL_RE = /https?:\/\/[^\s<>()"']+[^\s<>()"'.,;:!?]/g;

  function linkNode(url, label) {
    const a = document.createElement('a');
    a.href = url;
    a.textContent = label || url;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  function appendLinkified(parent, text) {
    let last = 0;
    for (const m of text.matchAll(URL_RE)) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      parent.appendChild(linkNode(m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function paragraphs(parent, text) {
    const blocks = String(text || '').split(/\n\s*\n/);
    for (const block of blocks) {
      const trimmed = block.trim();
      if (!trimmed) continue;
      const p = document.createElement('p');
      appendLinkified(p, trimmed);
      parent.appendChild(p);
    }
  }

  /* A sit marker carries its resolved program; markers logged before the
     practice library existed become a bare unguided sit of `content` minutes. */
  function programOf(msg) {
    const program = msg.data && msg.data.program;
    if (program && program.components) return program;
    const mins = parseInt(msg.content, 10) || 0;
    return {
      sit_minutes: mins,
      components: [{
        slug: DEFAULT_SIT_SLUG, kind: 'unguided', name: 'Unguided sit',
        steps: [{ title: 'Sit', duration_s: mins * 60, bell: 'long' }],
      }],
    };
  }

  /* "Spinal Energy Series, abbreviated · 20-minute sit" */
  function programLabel(program) {
    const parts = [];
    for (const c of program.components || []) {
      if (c.kind === 'warmup') parts.push(c.name);
      else if (c.slug !== DEFAULT_SIT_SLUG) parts.push(c.name);
    }
    parts.push(program.sit_minutes + '-minute sit');
    return parts.join(' · ');
  }

  /* "1:30" — an open-ended step has no number to show. */
  function clockLabel(seconds) {
    if (!seconds) return '—';
    const m = Math.floor(seconds / 60);
    return m + ':' + String(Math.round(seconds % 60)).padStart(2, '0');
  }

  function componentSeconds(playlist, componentIdx) {
    return playlist.reduce(
      (sum, it) => it.componentIdx === componentIdx ? sum + (it.duration || 0) : sum, 0);
  }

  /* The step list, used by both the proposed-routine card and the runner TOC, so
     what you agree to and what you then sit through read the same. Takes a
     playlist (buildPlaylist output); opts.onPick makes the rows clickable. */
  function stepListNode(playlist, opts) {
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'steplist' + (opts.onPick ? '' : ' static');
    const rows = [];
    let lastComponent = -1;
    playlist.forEach((item, i) => {
      // In the conversation the warm-up is one line — its total is all you agree
      // to. The sit itself always shows its steps, there and in the runner.
      const collapsed = opts.collapseWarmups && item.component.kind === 'warmup';
      if (item.componentIdx !== lastComponent) {
        lastComponent = item.componentIdx;
        const head = document.createElement('div');
        head.className = 'steplist-comp';
        const name = document.createElement('span');
        name.textContent = item.component.name || item.component.slug;
        const total = document.createElement('span');
        total.className = 'steplist-dur';
        total.textContent = clockLabel(componentSeconds(playlist, item.componentIdx));
        head.append(name, total);
        el.appendChild(head);
        if (item.component.citation) {
          const cite = document.createElement('div');
          cite.className = 'steplist-cite';
          cite.textContent = item.component.citation;
          el.appendChild(cite);
        }
      }
      if (collapsed) return;
      const row = document.createElement('button');
      row.className = 'steplist-step';
      const name = document.createElement('span');
      name.textContent = item.step.title || 'Step ' + (item.stepIdx + 1);
      const dur = document.createElement('span');
      dur.className = 'steplist-dur';
      dur.textContent = clockLabel(item.duration);
      row.append(name, dur);
      if (opts.onPick) row.addEventListener('click', () => opts.onPick(i));
      else row.tabIndex = -1;
      rows.push(row);
      el.appendChild(row);
    });
    return { node: el, rows };
  }

  /* "18 min" — the options card's only number */
  function minutesLabel(seconds) {
    if (!seconds) return '';
    return Math.max(1, Math.round(seconds / 60)) + ' min';
  }

  function messageNode(msg) {
    if (msg.role === 'sit') {
      const el = document.createElement('div');
      el.className = 'sit-marker';
      const mins = document.createElement('span');
      mins.className = 'sit-mins';
      mins.textContent = programLabel(programOf(msg));
      const btn = document.createElement('button');
      btn.className = 'sit-timer';
      btn.textContent = '▶ start';
      btn.title = 'Play this routine — countdowns and bells';
      btn.addEventListener('click', () => openRunner(msg));
      el.append(mins, btn);
      return el;
    }

    if (msg.role === 'tool' && msg.tool_label === 'Proposed routine' && msg.data) {
      const el = document.createElement('div');
      el.className = 'tool proposal';
      const label = document.createElement('div');
      label.className = 'tool-label';
      label.textContent = msg.tool_label;
      const body = document.createElement('div');
      body.className = 'tool-body';
      // The note is why this routine; the step list below is what it is.
      appendLinkified(body, msg.data.note || msg.content || '');
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = '▶ Start';
      btn.addEventListener('click', () => startProposal(msg, btn));
      el.append(label, body);
      if (msg.data.program) {
        el.appendChild(stepListNode(
          buildPlaylist(msg.data.program), { collapseWarmups: true }).node);
      }
      el.appendChild(btn);
      return el;
    }

    if (msg.role === 'tool' && msg.data && msg.data.status === 'pending') {
      const el = document.createElement('div');
      el.className = 'tool notebook pending';
      const label = document.createElement('div');
      label.className = 'tool-label';
      label.textContent = msg.tool_label || 'Asking Rigdzin notebook…';
      const question = document.createElement('div');
      question.className = 'tool-body';
      appendLinkified(question, msg.content || '');
      const wait = document.createElement('div');
      wait.className = 'waiting';
      wait.textContent = 'Rigdzin is reflecting — this can take a minute or two. The answer will appear here, and Sit will pick up the thread.';
      el.append(label, question, wait);
      return el;
    }

    if (msg.role === 'tool' && msg.data && msg.data.answer) {
      const el = document.createElement('div');
      el.className = 'tool notebook collapsed';
      const label = document.createElement('div');
      label.className = 'tool-label';
      label.textContent = msg.tool_label;
      const question = document.createElement('div');
      question.className = 'tool-body';
      appendLinkified(question, msg.content || '');
      const answer = document.createElement('div');
      answer.className = 'answer';
      blockMarkdown(answer, msg.data.answer);
      const toggle = document.createElement('button');
      toggle.className = 'toggle';
      toggle.textContent = 'Show full answer';
      toggle.addEventListener('click', () => {
        const collapsed = el.classList.toggle('collapsed');
        toggle.textContent = collapsed ? 'Show full answer' : 'Show less';
        toggle.scrollIntoView({ block: 'nearest' });
      });
      el.append(label, question, answer, toggle);
      return el;
    }

    if (msg.role === 'tool' && msg.tool_label === 'Guided meditation options' && msg.data) {
      const el = document.createElement('div');
      el.className = 'tool options';
      el.dataset.played = msg.data.played || '';
      const label = document.createElement('div');
      label.className = 'tool-label';
      label.textContent = msg.tool_label;
      const inquiry = document.createElement('div');
      inquiry.className = 'tool-body';
      appendLinkified(inquiry, msg.content || '');
      el.append(label, inquiry);

      const choices = msg.data.choices || [];
      if (!choices.length) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = 'Nothing fits this morning.';
        el.appendChild(none);
        return el;
      }

      for (const choice of choices) {
        const row = document.createElement('div');
        row.className = 'choice';
        row.dataset.recId = choice.id;
        const meta = document.createElement('div');
        meta.className = 'meta';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = choice.name || choice.id;
        title.title = choice.name || choice.id;
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = [minutesLabel(choice.duration_s), choice.collection]
          .filter(Boolean).join(' \u00b7 ');
        meta.append(title, sub);
        if (choice.why) {
          const why = document.createElement('div');
          why.className = 'why';
          appendLinkified(why, choice.why);
          meta.appendChild(why);
        }
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = '\u25b6 play';
        btn.addEventListener('click', () => playChoice(choice, msg, el));
        row.append(meta, btn);
        el.appendChild(row);
      }
      return el;
    }

    if (msg.role === 'tool') {
      const el = document.createElement('div');
      el.className = 'tool';
      const label = document.createElement('div');
      label.className = 'tool-label';
      label.textContent = msg.tool_label || 'Tool';
      const body = document.createElement('div');
      body.className = 'tool-body';
      appendLinkified(body, msg.content || '');
      el.append(label, body);
      return el;
    }

    const el = document.createElement('div');
    el.className = 'msg ' + (msg.role === 'user' ? 'user' : 'assistant');
    if (msg.role !== 'user') {
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = 'Sit';
      el.appendChild(who);
    }
    paragraphs(el, msg.content);
    return el;
  }

  function pendingNode() {
    const el = document.createElement('div');
    el.className = 'msg assistant';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = 'Sit';
    const dots = document.createElement('p');
    dots.className = 'pending';
    dots.textContent = '…';
    el.append(who, dots);
    return el;
  }

  function noticeNode(text) {
    const el = document.createElement('div');
    el.className = 'notice';
    el.textContent = text;
    return el;
  }

  function scrollChat() {
    chat.scrollTop = chat.scrollHeight;
  }

  function renderChat(extra) {
    chat.replaceChildren();
    for (const msg of messages) chat.appendChild(messageNode(msg));
    if (extra) chat.appendChild(extra);
    paintOptionChips();
    scrollChat();
  }

  function renderPager() {
    pager.textContent = sessions.length
      ? (index + 1) + '/' + sessions.length
      : '—';
    prevBtn.disabled = busy || index <= 0;
    nextBtn.disabled = busy || index < 0 || index >= sessions.length - 1;
    newBtn.disabled = busy;
  }

  function setBusy(state) {
    busy = state;
    input.disabled = state;
    sendBtn.disabled = state;
    addSitBtn.disabled = state;
    renderPager();
  }

  /* ————— guided player —————
     A docked row above the sit row, backed by one <audio> for the whole page.
     It lives outside the chat pane, so it survives every renderChat and every
     session switch: a recording keeps playing until it is unloaded. */

  const player = {
    el: document.getElementById('player'),
    audio: document.getElementById('pl-audio'),
    playBtn: document.getElementById('pl-play'),
    titleEl: document.getElementById('pl-title'),
    seek: document.getElementById('pl-seek'),
    timeEl: document.getElementById('pl-time'),
    id: null,          // the recording loaded, null when the row is hidden
    title: '',
    msg: null,         // the options message it came from — its data.played
    card: null,        // and that message's card, for the chip
    sessionId: null,   // the session the listen is filed under
    logged: false,     // one listen per load, not per resume
    dragging: false,   // scrubbing: don't fight the thumb with timeupdate
  };

  function fmtClock(seconds) {
    const s = Math.max(0, Math.floor(isFinite(seconds) ? seconds : 0));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function paintPlayer() {
    const audio = player.audio;
    const dur = isFinite(audio.duration) ? audio.duration : 0;
    player.playBtn.textContent = audio.paused ? '\u25b6' : '\u2759\u2759';
    player.playBtn.title = audio.paused ? 'Play' : 'Pause';
    if (!player.dragging) {
      player.seek.max = dur || 0;
      player.seek.value = Math.min(audio.currentTime, dur || audio.currentTime);
    }
    player.timeEl.textContent = fmtClock(audio.currentTime) + ' / ' + fmtClock(dur);
    // the track paints its own elapsed fill from this
    const pct = dur ? Math.min(100, (Number(player.seek.value) / dur) * 100) : 0;
    player.seek.style.setProperty('--pl-pct', pct.toFixed(2) + '%');
  }

  /* Every options card on screen, repainted from `played` and what's playing. */
  function paintOptionChips() {
    for (const card of chat.querySelectorAll('.tool.options')) {
      const played = card.dataset.played || '';
      for (const row of card.querySelectorAll('.choice')) {
        const chip = row.querySelector('.chip');
        const current = player.id === row.dataset.recId;
        const live = current && !player.audio.paused;
        const spent = !live && (current || row.dataset.recId === played);
        chip.textContent = live ? 'playing' : spent ? 'played' : '\u25b6 play';
        chip.classList.toggle('playing', live);
        chip.classList.toggle('played', spent);
      }
    }
  }

  /* Names the recording on the lock screen and wires its transport controls. */
  function playerMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: player.title, artist: 'Sit' });
    const handlers = {
      play: () => playPlayer(),
      pause: () => pausePlayer(),
      seekbackward: e => nudgePlayer(-((e && e.seekOffset) || 15)),
      seekforward: e => nudgePlayer((e && e.seekOffset) || 15),
      seekto: e => {
        if (!e || e.seekTime == null) return;
        player.audio.currentTime = e.seekTime;
        paintPlayer();
      },
    };
    for (const action of Object.keys(handlers)) {
      try { navigator.mediaSession.setActionHandler(action, handlers[action]); }
      catch (err) { /* unsupported action */ }
    }
  }

  /* The play chip on an options card: the loaded one toggles, any other one
     replaces the track. */
  function playChoice(choice, msg, card) {
    if (player.id === choice.id) { togglePlayer(); return; }
    player.id = choice.id;
    player.title = choice.name || choice.id;
    player.msg = msg;
    player.card = card;
    player.logged = false;
    player.sessionId = (index >= 0 && sessions[index]) ? sessions[index].id : null;
    player.titleEl.textContent = player.title;
    player.titleEl.title = player.title;
    player.audio.src = '/media/recordings/' + encodeURIComponent(choice.id) + '.mp3';
    player.audio.load();
    player.el.classList.add('on');
    player.el.classList.remove('failed');
    paintPlayer();
    playPlayer();
  }

  function playPlayer() {
    if (!player.id) return;
    playerMediaSession();
    const id = player.id;
    const started = player.audio.play();
    if (!started) return;
    started.then(() => {
      if (player.id !== id || player.logged) return;   // one listen per load
      player.logged = true;
      logListen(id);
    }, () => { /* the browser refused playback; the row still shows */ });
  }

  function pausePlayer() {
    if (player.id) player.audio.pause();
  }

  function togglePlayer() {
    if (player.audio.paused) playPlayer(); else pausePlayer();
  }

  function nudgePlayer(delta) {
    if (!player.id) return;
    const dur = isFinite(player.audio.duration) ? player.audio.duration : Infinity;
    player.audio.currentTime = Math.max(0, Math.min(dur, player.audio.currentTime + delta));
    paintPlayer();
  }

  function unloadTrack() {
    player.audio.pause();
    player.audio.removeAttribute('src');
    player.audio.load();
    player.id = null;
    player.msg = null;
    player.card = null;
    player.title = '';
    player.titleEl.textContent = '';
    player.el.classList.remove('on', 'failed');
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
    paintPlayer();
    paintOptionChips();
  }

  /* One row per load. The server stamps `played` on the card it was played from;
     mirror it here so the chip flips without a reload. */
  async function logListen(recordingId) {
    const msg = player.msg, card = player.card;
    if (player.sessionId) {
      // the card that was clicked, not whichever one is newest; a failed post
      // must not leave the chip saying "play" for audio the user can hear
      await postJSON(
        '/api/morning/sessions/' + encodeURIComponent(player.sessionId) + '/listens',
        { recording_id: recordingId, message_id: msg ? msg.id : null }).catch(() => {});
    }
    if (msg) { msg.data = msg.data || {}; msg.data.played = recordingId; }
    if (card) card.dataset.played = recordingId;
    paintOptionChips();
  }

  for (const ev of ['timeupdate', 'loadedmetadata', 'durationchange', 'ended']) {
    player.audio.addEventListener(ev, paintPlayer);
  }
  player.audio.addEventListener('error', () => {
    // a missing or unplayable file stays visible as a failure, not a silent 0:00
    player.title += " — couldn't load";
    player.titleEl.textContent = player.title;
    player.el.classList.add('failed');
    paintPlayer();
  });
  for (const ev of ['play', 'pause', 'ended']) {
    player.audio.addEventListener(ev, () => { paintPlayer(); paintOptionChips(); });
  }

  player.playBtn.addEventListener('click', togglePlayer);
  document.getElementById('pl-back').addEventListener('click', () => nudgePlayer(-15));
  document.getElementById('pl-fwd').addEventListener('click', () => nudgePlayer(15));
  document.getElementById('pl-close').addEventListener('click', unloadTrack);

  player.seek.addEventListener('input', () => {
    player.dragging = true;
    player.audio.currentTime = Number(player.seek.value);
    player.timeEl.textContent =
      fmtClock(player.audio.currentTime) + ' / ' + fmtClock(player.audio.duration);
  });
  player.seek.addEventListener('change', () => { player.dragging = false; paintPlayer(); });

  /* ————— journal ————— */

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function inlineMarkdown(text) {
    // Anchors are stashed as \x00N\x00 tokens so the emphasis regexes below
    // can't mangle characters inside URLs (underscores, asterisks).
    const anchors = [];
    const stash = (url, label) => {
      anchors.push('<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>');
      return '\x00' + (anchors.length - 1) + '\x00';
    };
    return escapeHtml(text)
      .replace(/\[\[([^\]]+)\]\]/g, '$1')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => stash(url, label))
      .replace(URL_RE, url => stash(url, url))
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      .replace(/^\s*#{1,6}\s+/, '')
      .replace(/\x00(\d+)\x00/g, (_, i) => anchors[i]);
  }

  /* Headers, bullet/numbered lists, paragraphs — enough for a NotebookLM answer. */
  function blockMarkdown(parent, text) {
    let list = null;
    const closeList = () => { list = null; };
    for (const raw of String(text || '').split('\n')) {
      const line = raw.trim();
      if (!line || /^([-*_])\1{2,}$/.test(line)) { closeList(); continue; }
      const h = line.match(/^#{1,6}\s+(.*)$/);
      const li = line.match(/^(?:[-*]|\d+[.)])\s+(.*)$/);
      if (h) {
        closeList();
        const el = document.createElement('div');
        el.className = 'md-h';
        el.innerHTML = inlineMarkdown(h[1]);
        parent.appendChild(el);
      } else if (li) {
        const tag = /^\d/.test(line) ? 'ol' : 'ul';
        if (!list || list.tagName.toLowerCase() !== tag) {
          list = document.createElement(tag);
          parent.appendChild(list);
        }
        const el = document.createElement('li');
        el.innerHTML = inlineMarkdown(li[1]);
        list.appendChild(el);
      } else {
        closeList();
        const p = document.createElement('p');
        p.innerHTML = inlineMarkdown(line);
        parent.appendChild(p);
      }
    }
  }

  function todayLabel() {
    return new Date().toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  function entryNode(entry) {
    const article = document.createElement('article');
    article.className = 'entry';

    const date = document.createElement('div');
    date.className = 'date';
    date.append(document.createTextNode(entry.date || ''));
    if (entry.date === todayLabel()) {
      const pill = document.createElement('span');
      pill.className = 'fresh';
      pill.textContent = 'just written';
      date.appendChild(pill);
    }
    article.appendChild(date);

    const h2 = document.createElement('h2');
    h2.textContent = entry.title || '';
    article.appendChild(h2);

    let list = null;
    for (const raw of String(entry.body || '').split('\n')) {
      if (!raw.trim()) { list = null; continue; }
      const item = raw.match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
      if (item) {
        if (!list) {
          list = document.createElement('ul');
          article.appendChild(list);
        }
        const tabs = (item[1].match(/\t/g) || []).length;
        const depth = tabs || Math.floor(item[1].length / 2);
        let marker = /^\d/.test(item[2]) ? item[2] : '–';
        let text = item[3];
        const li = document.createElement('li');
        const box = text.match(/^\[( |x|X)\]\s*(.*)$/);
        if (box) {
          marker = box[1].trim() ? '☑' : '☐';
          text = box[2];
          if (box[1].trim()) li.className = 'done';
        }
        if (depth) li.style.marginLeft = (depth * 22) + 'px';
        const markerEl = document.createElement('span');
        markerEl.className = 'marker';
        markerEl.textContent = marker;
        const textEl = document.createElement('span');
        textEl.className = 'item-text';
        textEl.innerHTML = inlineMarkdown(text);
        li.append(markerEl, textEl);
        list.appendChild(li);
      } else {
        list = null;
        const p = document.createElement('p');
        p.innerHTML = inlineMarkdown(raw.trim());
        article.appendChild(p);
      }
    }
    return article;
  }

  function outlineItem(entry, i) {
    const a = document.createElement('a');
    const date = document.createElement('span');
    date.className = 'odate';
    date.textContent = entry.raw_date || '';
    a.append(date, document.createTextNode(entry.title || ''));
    a.addEventListener('click', () => {
      const target = document.getElementById('entry-' + i);
      if (target) {
        journalPane.scrollTop += target.getBoundingClientRect().top
          - journalPane.getBoundingClientRect().top - 12;
      }
      logWrap.classList.remove('outline-open');  // tray overlays the log on mobile
    });
    return a;
  }

  function trackOutline() {
    const entries = [...journalPane.querySelectorAll('.entry')];
    const links = [...outlinePane.querySelectorAll('a')];
    let ticking = false;
    function update() {
      ticking = false;
      const top = journalPane.getBoundingClientRect().top + 90;
      let active = 0;
      for (let i = 0; i < entries.length; i++) {
        if (entries[i].getBoundingClientRect().top <= top) active = i; else break;
      }
      links.forEach((a, i) => a.classList.toggle('active', i === active));
      const link = links[active];
      if (link) {
        const r = link.getBoundingClientRect(), o = outlinePane.getBoundingClientRect();
        if (r.top < o.top || r.bottom > o.bottom) {
          outlinePane.scrollTop += r.top - o.top - o.height / 2;
        }
      }
    }
    journalPane.addEventListener('scroll', () => {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    });
    update();
  }

  let journalLimit = 30;  // initial render cap (the full log is ~500KB); "show all" lifts it

  async function loadJournal() {
    journalPane.replaceChildren();
    outlinePane.replaceChildren();
    try {
      const data = await api('/api/morning/journal' + (journalLimit ? '?limit=' + journalLimit : ''));
      const entries = data.entries || [];
      if (!entries.length) {
        journalPane.appendChild(noticeNode('No entries yet.'));
        return;
      }
      entries.forEach((entry, i) => {
        const node = entryNode(entry);
        node.id = 'entry-' + i;
        journalPane.appendChild(node);
        outlinePane.appendChild(outlineItem(entry, i));
      });
      if (journalLimit && entries.length >= journalLimit) {
        const more = document.createElement('button');
        more.className = 'load-more';
        more.textContent = 'Show all entries';
        more.addEventListener('click', () => { journalLimit = null; loadJournal(); });
        journalPane.appendChild(more);
      }
      trackOutline();
    } catch (err) {
      journalPane.appendChild(noticeNode('Could not load the log — ' + err.message));
    }
  }

  /* ————— sessions ————— */

  /* ————— async Rigdzin answers —————
     A notebook query runs in the background; its card starts `pending` and the
     agent's applying reply lands in a later turn. While a pending card is in the
     thread, poll the message list and re-render as the answer + follow-up arrive. */
  let notebookPoller = null;

  function hasPending(list) {
    return (list || []).some(m => m.role === 'tool' && m.data && m.data.status === 'pending');
  }

  function messagesSig(list) {
    return (list || []).map(m => m.id + ':' + ((m.data && m.data.status) || m.role)).join('|');
  }

  function stopNotebookPoll() {
    if (notebookPoller) { clearInterval(notebookPoller); notebookPoller = null; }
  }

  /* Poll iff a pending card is showing; stop once the answer and its follow-up settle. */
  function syncNotebookPoll() {
    if (!hasPending(messages)) { stopNotebookPoll(); return; }
    if (notebookPoller || index < 0) return;
    const sid = sessions[index].id;
    let quiet = 0, ticks = 0, lastSig = messagesSig(messages);
    notebookPoller = setInterval(async () => {
      ticks++;
      if (index < 0 || !sessions[index] || sessions[index].id !== sid || ticks > 130) {
        stopNotebookPoll();
        return;
      }
      let data;
      try {
        data = await api('/api/morning/sessions/' + encodeURIComponent(sid) + '/messages');
      } catch (err) {
        return;  // transient — try again next tick
      }
      const fresh = data.messages || [];
      const sig = messagesSig(fresh);
      if (sig !== lastSig) {
        messages = fresh;
        renderChat();
        loadJournal();
        lastSig = sig;
        quiet = 0;
      } else {
        quiet++;
      }
      if (!hasPending(fresh) && quiet >= 3) stopNotebookPoll();
    }, 3000);
  }

  async function openSession(i) {
    stopNotebookPoll();
    index = i;
    renderPager();
    renderChat(pendingNode());
    try {
      const data = await api('/api/morning/sessions/' + encodeURIComponent(sessions[i].id) + '/messages');
      messages = data.messages || [];
      renderChat();
      syncNotebookPoll();
    } catch (err) {
      messages = [];
      renderChat(noticeNode('Could not load this session — ' + err.message));
    }
  }

  async function startSession() {
    setBusy(true);
    const pending = pendingNode();
    renderChat(pending);
    const turn = turnRenderer(pending);
    try {
      // The server sends a "session" event first, then the greeting streams
      // like any chat turn.
      await streamTurn('/api/morning/sessions', { timezone }, ev => {
        if (ev.type === 'session') {
          sessions.push(ev.session);
          index = sessions.length - 1;
          renderPager();
        } else {
          turn.handleEvent(ev);
        }
      });
      const done = turn.done();
      if (!done) throw new Error('the reply was cut off');
      messages = done.messages || [];
      renderChat();
      syncNotebookPoll();
    } catch (err) {
      messages = [];
      renderChat(noticeNode('Could not start a session — ' + err.message));
    } finally {
      setBusy(false);
    }
  }

  const TOOL_PENDING_LABELS = {
    ask_notebooklm: 'Asking Rigdzin notebook…',
    write_journal_entry: 'Writing journal entry…',
    propose_program: 'Proposing routine…',
    find_guided_meditations: 'Searching guided meditations…',
    create_component: 'Adding to library…',
  };

  function updateToolChip(chip, label, content) {
    chip.querySelector('.tool-label').textContent = label;
    const body = chip.querySelector('.tool-body');
    body.replaceChildren();
    appendLinkified(body, content || '');
  }

  /* Renders one streamed agent turn: text deltas fill an in-progress bubble;
     tool events add and update chips; the final "done" event is kept for the caller. */
  function turnRenderer(pending) {
    let streamMsg = null, streamWho = null, streamText = '';
    const toolChips = [];
    let execIdx = 0;
    let done = null;

    function handleEvent(ev) {
      pending.remove();
      if (ev.type === 'text') {
        if (!streamMsg) {
          streamMsg = document.createElement('div');
          streamMsg.className = 'msg assistant';
          streamWho = document.createElement('div');
          streamWho.className = 'who';
          streamWho.textContent = 'Sit';
          streamMsg.appendChild(streamWho);
          streamText = '';
          chat.appendChild(streamMsg);
        }
        streamText += ev.delta;
        streamMsg.replaceChildren(streamWho);
        paragraphs(streamMsg, streamText);
      } else if (ev.type === 'tool_pending') {
        streamMsg = null;  // any following text starts a fresh bubble
        const chip = messageNode({
          role: 'tool',
          tool_label: TOOL_PENDING_LABELS[ev.name] || ev.name,
          content: '',
        });
        toolChips.push(chip);
        chat.appendChild(chip);
      } else if (ev.type === 'tool') {
        if (toolChips[execIdx]) updateToolChip(toolChips[execIdx], ev.tool_label, ev.content);
      } else if (ev.type === 'tool_done') {
        // Re-render from the final message rather than patching text: only now
        // does it carry `data`, which turns a proposal into its Start card.
        const chip = toolChips[execIdx];
        const node = messageNode(ev.message);
        if (chip) { chip.replaceWith(node); toolChips[execIdx] = node; }
        else chat.appendChild(node);
        execIdx++;
        paintOptionChips();   // a card arriving mid-turn, while a track plays
        // the model just grew the library — a proposal in this same turn can
        // name the new component only if the menu catches up now
        if (String(ev.message.tool_label || '').startsWith('Added to library')) fetchComponents();
      } else if (ev.type === 'done') {
        done = ev;
      }
      scrollChat();
    }

    return { handleEvent, done: () => done };
  }

  /* POST, then parse the SSE body, calling handleEvent per event. */
  async function streamTurn(path, body, handleEvent) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      buf += decoder.decode(value, { stream: true });
      const chunks = buf.split('\n\n');
      buf = chunks.pop();
      for (const chunk of chunks) {
        for (const line of chunk.split('\n')) {
          if (line.startsWith('data: ')) handleEvent(JSON.parse(line.slice(6)));
        }
      }
    }
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy || index < 0) return;
    input.value = '';
    autosize();
    messages.push({ id: 'local-' + Date.now(), role: 'user', content: text });
    setBusy(true);
    const pending = pendingNode();
    renderChat(pending);
    const turn = turnRenderer(pending);

    try {
      await streamTurn(
        '/api/morning/sessions/' + encodeURIComponent(sessions[index].id) + '/chat',
        { message: text, timezone }, turn.handleEvent);
      const done = turn.done();
      if (!done) throw new Error('the reply was cut off');

      messages = messages.concat(done.messages || []);
      renderChat();
      syncNotebookPoll();
      if (done.journal_written) {
        sessions[index].journal_written_at = new Date().toISOString();
        loadJournal();
      }
    } catch (err) {
      pending.remove();
      chat.appendChild(noticeNode('Message failed — ' + err.message));
      scrollChat();
    } finally {
      setBusy(false);
      input.focus();
    }
  }

      sessions = data.sessions || [];
    } catch (err) {
      renderChat(noticeNode('Could not reach the server — ' + err.message));
      renderPager();
      return;

    const latest = sessions[sessions.length - 1];
    if (!latest || latest.journal_written_at) {
      await startSession();
    } else {
      await openSession(sessions.length - 1);
    }
  }

  /* ————— routine menu: which warm-up, which sit ————— */

  const sitRow = document.querySelector('.sit-row');
  const sitFixed = document.getElementById('sit-fixed');
  const routineBtn = document.getElementById('routine-btn');
  const routinePanel = document.getElementById('routine-panel');
  const rpWarmups = document.getElementById('rp-warmups');
  const rpSits = document.getElementById('rp-sits');

  const componentBySlug = slug => components.find(c => c.slug === slug);

  // A slug the library hasn't caught up with yet still names itself.
  const componentName = slug => (componentBySlug(slug) || {}).name || slug;

  /* below a minute the server says seconds, so say seconds */
  function lengthLabel(seconds) {
    return seconds < 60 ? seconds + ' s' : Math.round(seconds / 60) + ' min';
  }

  function routineLabel() {
    const sitName = routine.sit_slug === DEFAULT_SIT_SLUG ? 'sit' : componentName(routine.sit_slug);
    const warmups = routine.warmup_slugs.map(componentName);
    if (warmups.length) return warmups.join(' + ') + ' → ' + sitName;
    return sitName === 'sit' ? 'just sit' : sitName;
  }

  /* A fixed-length guided sit brings its own duration; the chips step aside,
     and the length the user picked waits for them to come back. */
  function syncSitLength() {
    const sit = componentBySlug(routine.sit_slug);
    const fixed = sit && !sit.has_fill && sit.fixed_s > 0;
    sitRow.classList.toggle('fixed-length', !!fixed);
    if (fixed) {
      sitMinutes = Math.max(1, Math.round(sit.fixed_s / 60));   // the API takes minutes
      sitFixed.textContent = lengthLabel(sit.fixed_s);
    } else {
      applyMinutes(chosenMinutes);
    }
  }

  function renderRoutineBtn() {
    const label = routineLabel();
    routineBtn.firstElementChild.textContent = label;
    routineBtn.title = 'Routine: ' + label;

  function optionNode(group, value, name, length, summary) {
    const label = document.createElement('label');
    label.className = 'rp-opt';
    if (summary) label.title = summary;
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = group;
    radio.value = value;
    label.append(radio, document.createTextNode(name));
    if (length) {
      const len = document.createElement('span');
      len.className = 'rp-len';
      len.textContent = length;
      label.appendChild(len);
    }
    return label;
  }

  function renderRoutinePanel() {
    rpWarmups.replaceChildren(optionNode('rp-warmup', '', 'none'));
    for (const c of components.filter(c => c.kind === 'warmup')) {
      rpWarmups.appendChild(optionNode(
        'rp-warmup', c.slug, c.name, c.fixed_s ? lengthLabel(c.fixed_s) : '', c.summary));
    }
    rpSits.replaceChildren();
    for (const c of components.filter(c => c.kind !== 'warmup')) {
      rpSits.appendChild(optionNode(
        'rp-sit', c.slug, c.name, c.has_fill ? 'any length' : lengthLabel(c.fixed_s), c.summary));
    }
    syncRoutineRadios();
  }

  function syncRoutineRadios() {
    const warmup = routine.warmup_slugs[0] || '';
    for (const r of rpWarmups.querySelectorAll('input')) r.checked = r.value === warmup;
    for (const r of rpSits.querySelectorAll('input')) r.checked = r.value === routine.sit_slug;
  }

  /* `validate` drops slugs the library doesn't know — only the saved choice
     needs it. A proposal's slugs go through verbatim: the model may have created
     the component in this same turn, and the server validates them anyway. */
  function applyRoutine(next, validate) {
    const known = slug => !validate || !!componentBySlug(slug);
    routine = {
      warmup_slugs: (next.warmup_slugs || []).filter(known),
      sit_slug: next.sit_slug && known(next.sit_slug) ? next.sit_slug : DEFAULT_SIT_SLUG,
    };
    // Don't persist while the library is unreachable — everything validates to
    // the default then, which would quietly erase a real choice.
    if (components.length) localStorage.setItem('sit.routine', JSON.stringify(routine));
    syncRoutineRadios();
    renderRoutineBtn();
    syncSitLength();
  }

  routinePanel.addEventListener('change', e => {
    if (e.target.name === 'rp-warmup') {
      applyRoutine({ ...routine, warmup_slugs: e.target.value ? [e.target.value] : [] });
    } else if (e.target.name === 'rp-sit') {
      applyRoutine({ ...routine, sit_slug: e.target.value });
    }
  });

  function setRoutinePanel(open) {
    routinePanel.hidden = !open;
    routineBtn.classList.toggle('open', open);
  }

  routineBtn.addEventListener('click', e => {
    e.stopPropagation();
    const opening = routinePanel.hidden;
    setRoutinePanel(opening);
    if (opening) fetchComponents();   // the model may have added one since load
  });

  document.addEventListener('click', e => {
    if (!routinePanel.hidden && !routinePanel.contains(e.target)) setRoutinePanel(false);
  });

  async function fetchComponents() {
    try {
      const data = await api('/api/morning/components');
      components = data.components || [];
    } catch (err) {
      /* keep whatever we have; an empty menu degrades to "just sit" */
    }
    renderRoutinePanel();
  }

  async function loadComponents() {
    await fetchComponents();
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('sit.routine') || '{}'); } catch (err) { /* ignore */ }
    applyRoutine(
      { warmup_slugs: saved.warmup_slugs || [], sit_slug: saved.sit_slug || DEFAULT_SIT_SLUG }, true);
  }

  /* ————— sit history calendar ————— */

  const historyBtn = document.getElementById('history-btn');
  const historyPanel = document.getElementById('history-panel');
  const calTitle = document.getElementById('cal-title');
  const calGrid = document.getElementById('cal-grid');

  let calYear, calMonth;   // currently displayed month

  function localISO(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  async function loadCalendar() {
    const last = new Date(calYear, calMonth + 1, 0).getDate();
    calTitle.textContent = new Date(calYear, calMonth, 1)
      .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    let days = {};
    try {
      const data = await api('/api/morning/sits?start=' + localISO(calYear, calMonth, 1)
        + '&end=' + localISO(calYear, calMonth, last)
        + '&timezone=' + encodeURIComponent(timezone));
      days = data.days || {};
    } catch (err) { /* render empty month; toggling will surface errors */ }

    calGrid.replaceChildren();
    for (const dow of ['S', 'M', 'T', 'W', 'T', 'F', 'S']) {
      const el = document.createElement('div');
      el.className = 'dow';
      el.textContent = dow;
      calGrid.appendChild(el);
    }
    const firstDow = new Date(calYear, calMonth, 1).getDay();
    for (let i = 0; i < firstDow; i++) calGrid.appendChild(document.createElement('div'));

    const now = new Date();
    const todayISO = localISO(now.getFullYear(), now.getMonth(), now.getDate());
    for (let d = 1; d <= last; d++) {
      const iso = localISO(calYear, calMonth, d);
      const cell = document.createElement('button');
      cell.className = 'day';
      cell.textContent = d;
      const minutes = days[iso] || 0;
      if (minutes) {
        cell.classList.add('sat');
        cell.title = minutes + ' min';
      }
      if (iso === todayISO) cell.classList.add('today');
      if (iso > todayISO) cell.classList.add('future');
      cell.addEventListener('click', async () => {
        cell.disabled = true;
        try {
          const res = await postJSON('/api/morning/sits/toggle',
            { date: iso, sit_minutes: sitMinutes, timezone });
          cell.classList.toggle('sat', res.minutes > 0);
          cell.title = res.minutes ? res.minutes + ' min' : '';
        } catch (err) {
          cell.textContent = '!';
        } finally {
          cell.disabled = false;
        }
      });
      calGrid.appendChild(cell);
    }
  }

  historyBtn.addEventListener('click', () => {

  /* ————— add sit: pin a sit marker into the conversation, no model turn ————— */

  async function logSit() {

      '/api/morning/sessions/' + encodeURIComponent(sessions[index].id) + '/sits',
      {
