<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sit</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#FAF7F1">
<style>
  :root {
    --ink: #2A2723;
    --ink-soft: #55503F;
    --ink-faded: #877F72;
    --paper: #FAF7F1;
    --paper-raised: #F3EEE3;
    --hairline: #E4DDCE;
    --hairline-strong: #CFC6B2;
    --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --sans: 'Outfit', -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    font-weight: 300;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    max-width: 1280px;
    height: 100vh;
    margin: 0 auto;
  }

  .divider { background: var(--hairline-strong); }

  /* ————— left: conversation ————— */

  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  .pane-header {
    padding: 28px 40px 18px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .pane-header h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .pane-header .sub {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
  }

  .session-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .session-nav .pager {
    font-size: 13px;
    color: var(--ink-faded);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .session-nav button {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 5px 12px;
    cursor: pointer;
  }

  button:disabled { opacity: 0.35; cursor: default; }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 28px 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .msg { max-width: 92%; }

  .msg .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin-bottom: 6px;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 14px 18px;
  }

  .msg.assistant { align-self: flex-start; }

  .msg p + p { margin-top: 10px; }

  .msg .pending { color: var(--ink-faded); letter-spacing: 0.2em; }

  .notice {
    align-self: flex-start;
    font-size: 14px;
    font-style: italic;
    color: var(--ink-faded);
  }

  /* tool call chips */
  .tool {
    align-self: flex-start;
    border-left: 2px solid var(--hairline-strong);
    padding: 6px 0 6px 16px;
    max-width: 92%;
  }

  .tool .tool-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
  }

  .tool .tool-body {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 3px;
  }

  /* sit duration bar, pinned under the header */
  .sit-block {
    border-bottom: 1px solid var(--hairline);
    padding: 14px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .sit-block .sit-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin-right: 4px;
  }

  .sit-block .durations { display: flex; gap: 8px; }

  .sit-block .play {
    margin-left: auto;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink-faded);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 8px 14px;
    cursor: pointer;
  }

  .chip {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 8px 16px;
    cursor: pointer;
  }

  .chip.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .chip-custom {
    width: 58px;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .chip-custom::-webkit-outer-spin-button,
  .chip-custom::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .chip-custom::placeholder { color: var(--ink-faded); }

  .chip-custom.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* sit history calendar */
  .sit-block { position: relative; }

  .play.history-btn { margin-left: 10px; }

  .history-panel {
    position: absolute;
    top: calc(100% + 1px);
    right: 40px;
    z-index: 5;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 16px 18px 12px;
    width: 292px;
  }

  .cal-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .cal-head .cal-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
  }

  .cal-head button {
    font-size: 15px;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 0 8px;
    cursor: pointer;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-grid .dow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faded);
    text-align: center;
    padding: 3px 0 5px;
  }

  .cal-grid .day {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    text-align: center;
    line-height: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--sans);
    font-weight: 300;
  }

  .cal-grid .day:hover { background: var(--paper-raised); }

  .cal-grid .day.sat {
    background: var(--ink);
    color: var(--paper);
  }

  .cal-grid .day.today { box-shadow: inset 0 0 0 1px var(--hairline-strong); }

  .cal-grid .day.future {
    color: var(--hairline-strong);
    pointer-events: none;
  }

  .cal-hint {
    font-size: 11px;
    color: var(--ink-faded);
    margin-top: 10px;
    text-align: center;
  }

  /* composer */
  .composer {
    border-top: 1px solid var(--hairline);
    padding: 18px 40px 24px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
  }

  .composer textarea {
    flex: 1;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 300;
    color: var(--ink);
    background: none;
    border: none;
    outline: none;
    resize: none;
    line-height: 1.5;
    padding: 6px 0;
    max-height: 40vh;
    overflow-y: auto;
  }

  .composer textarea::placeholder { color: var(--ink-faded); }

  .composer .send {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 9px 18px;
    cursor: pointer;
  }

  /* ————— right: wake-up log ————— */

  .log-wrap {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .log-scroll {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 28px 28px 40px 40px;
  }

  .entry li, .entry p { overflow-wrap: anywhere; }

  /* outline rail */
  .outline {
    width: 208px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 22px 18px 40px 16px;
    border-left: 1px solid var(--hairline);
    scrollbar-width: thin;
  }

  .outline a {
    display: block;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink-faded);
    text-decoration: none;
    padding: 4px 0;
    cursor: pointer;
  }

  .outline a .odate {
    font-variant-numeric: tabular-nums;
    margin-right: 5px;
  }

  .outline a:hover { color: var(--ink-soft); }
  .outline a.active { color: var(--ink); }

  .log-wrap.outline-hidden .outline { display: none; }

  .outline-toggle {
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 4px 10px;
    cursor: pointer;
  }

  .outline-toggle.on {
    color: var(--ink-soft);
    border-color: var(--hairline-strong);
  }

  .entry { padding: 22px 0; border-bottom: 1px solid var(--hairline); }
  .entry:first-child { padding-top: 4px; }

  .entry .date {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-faded);
    margin-bottom: 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .entry .fresh {
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 1px 8px;
    font-size: 10px;
  }

  .entry h2 {
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 500;
    line-height: 1.25;
    margin-bottom: 10px;
    text-wrap: balance;
  }

  .entry ul { list-style: none; }

  .entry li {
    font-size: 15px;
    color: var(--ink-soft);
    padding-left: 26px;
    position: relative;
    margin-bottom: 7px;
  }

  .entry li .marker {
    position: absolute;
    left: 0;
    color: var(--ink-faded);
    font-variant-numeric: tabular-nums;
  }

  .entry li.done { color: var(--ink-faded); }
  .entry li.done .item-text { text-decoration: line-through; }

  .entry p {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  .entry li strong, .entry p strong { font-weight: 500; color: var(--ink); }

  .log-scroll .notice { display: block; padding-top: 4px; }

  /* ————— timer overlay ————— */

  .timer-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    cursor: pointer;
    z-index: 10;
  }

  .timer-overlay.on { display: flex; }

  .timer-overlay .countdown {
    font-family: var(--serif);
    font-size: 190px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .timer-overlay .intention {
    font-family: var(--serif);
    font-style: italic;
    font-size: 24px;
    color: var(--ink-soft);
    max-width: 560px;
    text-align: center;
    text-wrap: balance;
  }

  .timer-overlay .intention:empty { display: none; }

  .timer-overlay .hint {
    position: fixed;
    bottom: 36px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-faded);
  }

  /* ————— mobile: stack panes, chat first ————— */

  @media (max-width: 900px) {
    .app {
      display: flex;
      flex-direction: column;
      height: auto;
    }

    .divider { display: none; }

    .pane:first-child {
      height: 100dvh;
      border-bottom: 1px solid var(--hairline-strong);
    }

    .pane-header {
      padding: 16px 20px 12px;
      flex-wrap: wrap;
      gap: 6px 12px;
    }

    .pane-header h1 { font-size: 24px; }

    .sit-block {
      padding: 12px 20px;
      flex-wrap: wrap;
      row-gap: 8px;
    }

    .chip { padding: 8px 13px; }

    .chip-custom { font-size: 16px; } /* <16px inputs trigger iOS zoom-on-focus */

    .history-panel {
      left: 20px;
      right: 20px;
      width: auto;
    }

    .chat-scroll { padding: 20px; gap: 18px; }

    .composer {
      padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
    }

    /* log pane scrolls with the page below the chat screen */
    .log-wrap { display: block; }
    .log-scroll { overflow: visible; padding: 4px 20px 40px; }
    .outline, .outline-toggle { display: none; }

    .timer-overlay .countdown { font-size: min(150px, 26vw); }
    .timer-overlay .intention { font-size: 20px; padding: 0 24px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ——— LEFT: conversation ——— -->
  <section class="pane">
    <header class="pane-header">
      <h1 id="today"></h1>
      <div class="session-nav">
        <button id="prev" title="Previous session">‹</button>
        <span class="pager" id="pager"></span>
        <button id="next" title="Next session">›</button>
        <button id="new-session">New session</button>
      </div>
    </header>

    <div class="sit-block">
      <span class="sit-label">Sat for</span>
      <div class="durations" id="durations">
        <button class="chip">5</button>
        <button class="chip">10</button>
        <button class="chip">20</button>
        <button class="chip selected">30</button>
        <button class="chip">40</button>
        <input class="chip chip-custom" id="custom-min" type="number" min="1" max="600" placeholder="…">
      </div>
      <button class="play" id="play" title="Optional: count down, chime at the end">▶ timer</button>
      <button class="play history-btn" id="history-btn" title="Backfill sit history">history</button>

      <div class="history-panel" id="history-panel" hidden>
        <div class="cal-head">
          <button id="cal-prev" title="Previous month">‹</button>
          <span class="cal-title" id="cal-title"></span>
          <button id="cal-next" title="Next month">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-hint">tap a day to toggle a sit — uses the selected duration</div>
      </div>
    </div>

    <div class="chat-scroll" id="chat"></div>

    <div class="composer">
      <textarea id="input" rows="2" placeholder="Check in…"></textarea>
      <button class="send" id="send">Send</button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- ——— RIGHT: wake-up log ——— -->
  <section class="pane">
    <header class="pane-header">
      <h1>Wake up log</h1>
      <button class="outline-toggle" id="outline-toggle" title="Show or hide the outline">outline</button>
    </header>

    <div class="log-wrap">
      <div class="log-scroll" id="journal"></div>
      <nav class="outline" id="outline"></nav>
    </div>
  </section>
</div>

<div class="timer-overlay" id="overlay">
  <div class="countdown" id="countdown">30:00</div>
  <div class="intention" id="intention"></div>
  <div class="hint">tap anywhere to end</div>
</div>

<script>
  const chat = document.getElementById('chat');
  const journalPane = document.getElementById('journal');
  const outlinePane = document.getElementById('outline');
  const pager = document.getElementById('pager');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const newBtn = document.getElementById('new-session');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const overlay = document.getElementById('overlay');
  const countdown = document.getElementById('countdown');
  const intention = document.getElementById('intention');

  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

  let sitMinutes = 30;
  let sessions = [];
  let index = -1;
  let messages = [];
  let busy = false;

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return res.json();
  }

  function postJSON(path, body) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  /* ————— rendering ————— */

  function paragraphs(parent, text) {
    const blocks = String(text || '').split(/\n\s*\n/);
    for (const block of blocks) {
      const trimmed = block.trim();
      if (!trimmed) continue;
      const p = document.createElement('p');
      p.textContent = trimmed;
      parent.appendChild(p);
    }
  }

  function messageNode(msg) {
    if (msg.role === 'tool') {
      const el = document.createElement('div');
      el.className = 'tool';
      const label = document.createElement('div');
      label.className = 'tool-label';
      label.textContent = msg.tool_label || 'Tool';
      const body = document.createElement('div');
      body.className = 'tool-body';
      body.textContent = msg.content || '';
      el.append(label, body);
      return el;
    }

    const el = document.createElement('div');
    el.className = 'msg ' + (msg.role === 'user' ? 'user' : 'assistant');
    if (msg.role !== 'user') {
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = 'Sit';
      el.appendChild(who);
    }
    paragraphs(el, msg.content);
    return el;
  }

  function pendingNode() {
    const el = document.createElement('div');
    el.className = 'msg assistant';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = 'Sit';
    const dots = document.createElement('p');
    dots.className = 'pending';
    dots.textContent = '…';
    el.append(who, dots);
    return el;
  }

  function noticeNode(text) {
    const el = document.createElement('div');
    el.className = 'notice';
    el.textContent = text;
    return el;
  }

  function scrollChat() {
    chat.scrollTop = chat.scrollHeight;
  }

  function renderChat(extra) {
    chat.replaceChildren();
    for (const msg of messages) chat.appendChild(messageNode(msg));
    if (extra) chat.appendChild(extra);
    scrollChat();
  }

  function renderPager() {
    pager.textContent = sessions.length
      ? 'session ' + (index + 1) + ' of ' + sessions.length
      : 'no sessions';
    prevBtn.disabled = busy || index <= 0;
    nextBtn.disabled = busy || index < 0 || index >= sessions.length - 1;
    newBtn.disabled = busy;
  }

  function setBusy(state) {
    busy = state;
    input.disabled = state;
    sendBtn.disabled = state;
    renderPager();
  }

  /* ————— journal ————— */

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function inlineMarkdown(text) {
    return escapeHtml(text)
      .replace(/\[\[([^\]]+)\]\]/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      .replace(/^\s*#{1,6}\s+/, '');
  }

  function todayLabel() {
    return new Date().toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  function entryNode(entry) {
    const article = document.createElement('article');
    article.className = 'entry';

    const date = document.createElement('div');
    date.className = 'date';
    date.append(document.createTextNode(entry.date || ''));
    if (entry.date === todayLabel()) {
      const pill = document.createElement('span');
      pill.className = 'fresh';
      pill.textContent = 'just written';
      date.appendChild(pill);
    }
    article.appendChild(date);

    const h2 = document.createElement('h2');
    h2.textContent = entry.title || '';
    article.appendChild(h2);

    let list = null;
    for (const raw of String(entry.body || '').split('\n')) {
      if (!raw.trim()) { list = null; continue; }
      const item = raw.match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
      if (item) {
        if (!list) {
          list = document.createElement('ul');
          article.appendChild(list);
        }
        const tabs = (item[1].match(/\t/g) || []).length;
        const depth = tabs || Math.floor(item[1].length / 2);
        let marker = /^\d/.test(item[2]) ? item[2] : '–';
        let text = item[3];
        const li = document.createElement('li');
        const box = text.match(/^\[( |x|X)\]\s*(.*)$/);
        if (box) {
          marker = box[1].trim() ? '☑' : '☐';
          text = box[2];
          if (box[1].trim()) li.className = 'done';
        }
        if (depth) li.style.marginLeft = (depth * 22) + 'px';
        const markerEl = document.createElement('span');
        markerEl.className = 'marker';
        markerEl.textContent = marker;
        const textEl = document.createElement('span');
        textEl.className = 'item-text';
        textEl.innerHTML = inlineMarkdown(text);
        li.append(markerEl, textEl);
        list.appendChild(li);
      } else {
        list = null;
        const p = document.createElement('p');
        p.innerHTML = inlineMarkdown(raw.trim());
        article.appendChild(p);
      }
    }
    return article;
  }

  function outlineItem(entry, i) {
    const a = document.createElement('a');
    const date = document.createElement('span');
    date.className = 'odate';
    date.textContent = entry.raw_date || '';
    a.append(date, document.createTextNode(entry.title || ''));
    a.addEventListener('click', () => {
      const target = document.getElementById('entry-' + i);
      if (target) {
        journalPane.scrollTop += target.getBoundingClientRect().top
          - journalPane.getBoundingClientRect().top - 12;
      }
    });
    return a;
  }

  function trackOutline() {
    const entries = [...journalPane.querySelectorAll('.entry')];
    const links = [...outlinePane.querySelectorAll('a')];
    let ticking = false;
    function update() {
      ticking = false;
      const top = journalPane.getBoundingClientRect().top + 90;
      let active = 0;
      for (let i = 0; i < entries.length; i++) {
        if (entries[i].getBoundingClientRect().top <= top) active = i; else break;
      }
      links.forEach((a, i) => a.classList.toggle('active', i === active));
      const link = links[active];
      if (link) {
        const r = link.getBoundingClientRect(), o = outlinePane.getBoundingClientRect();
        if (r.top < o.top || r.bottom > o.bottom) {
          outlinePane.scrollTop += r.top - o.top - o.height / 2;
        }
      }
    }
    journalPane.addEventListener('scroll', () => {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    });
    update();
  }

  async function loadJournal() {
    journalPane.replaceChildren();
    outlinePane.replaceChildren();
    try {
      const data = await api('/api/morning/journal');
      const entries = data.entries || [];
      if (!entries.length) {
        journalPane.appendChild(noticeNode('No entries yet.'));
        return;
      }
      entries.forEach((entry, i) => {
        const node = entryNode(entry);
        node.id = 'entry-' + i;
        journalPane.appendChild(node);
        outlinePane.appendChild(outlineItem(entry, i));
      });
      trackOutline();
    } catch (err) {
      journalPane.appendChild(noticeNode('Could not load the log — ' + err.message));
    }
  }

  /* ————— sessions ————— */

  async function openSession(i) {
    index = i;
    renderPager();
    renderChat(pendingNode());
    try {
      const data = await api('/api/morning/sessions/' + encodeURIComponent(sessions[i].id) + '/messages');
      messages = data.messages || [];
      renderChat();
    } catch (err) {
      messages = [];
      renderChat(noticeNode('Could not load this session — ' + err.message));
    }
  }

  async function startSession() {
    setBusy(true);
    renderChat(pendingNode());
    try {
      const data = await postJSON('/api/morning/sessions', { timezone });
      sessions.push(data.session);
      index = sessions.length - 1;
      messages = data.messages || [];
      renderChat();
    } catch (err) {
      messages = [];
      renderChat(noticeNode('Could not start a session — ' + err.message));
    } finally {
      setBusy(false);
    }
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy || index < 0) return;
    input.value = '';
    autosize();
    messages.push({ id: 'local-' + Date.now(), role: 'user', content: text });
    setBusy(true);
    renderChat(pendingNode());
    try {
      const data = await postJSON(
        '/api/morning/sessions/' + encodeURIComponent(sessions[index].id) + '/chat',
        { message: text, sit_minutes: sitMinutes, timezone }
      );
      messages = messages.concat(data.messages || []);
      renderChat();
      if (data.journal_written) {
        sessions[index].journal_written_at = new Date().toISOString();
        loadJournal();
      }
    } catch (err) {
      renderChat(noticeNode('Message failed — ' + err.message));
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  async function init() {
    document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric'
    });
    renderPager();
    renderChat(pendingNode());

    try {
      const data = await api('/api/morning/sessions');
      sessions = data.sessions || [];
    } catch (err) {
      renderChat(noticeNode('Could not reach the server — ' + err.message));
      renderPager();
      loadJournal();
      return;
    }

    const latest = sessions[sessions.length - 1];
    if (!latest || latest.journal_written_at) {
      await startSession();
    } else {
      await openSession(sessions.length - 1);
    }
    loadJournal();
  }

  /* ————— events ————— */

  prevBtn.addEventListener('click', () => { if (index > 0) openSession(index - 1); });
  nextBtn.addEventListener('click', () => { if (index < sessions.length - 1) openSession(index + 1); });
  newBtn.addEventListener('click', startSession);
  sendBtn.addEventListener('click', send);

  function autosize() {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  }
  input.addEventListener('input', autosize);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  const logWrap = document.querySelector('.log-wrap');
  const outlineToggle = document.getElementById('outline-toggle');

  function setOutlineVisible(visible) {
    logWrap.classList.toggle('outline-hidden', !visible);
    outlineToggle.classList.toggle('on', visible);
    localStorage.setItem('outlineVisible', visible ? '1' : '0');
  }

  outlineToggle.addEventListener('click', () => {
    setOutlineVisible(logWrap.classList.contains('outline-hidden'));
  });

  setOutlineVisible(localStorage.getItem('outlineVisible') !== '0');

  const customMin = document.getElementById('custom-min');

  document.getElementById('durations').addEventListener('click', e => {
    const chip = e.target.closest('button.chip');
    if (!chip) return;
    for (const c of document.querySelectorAll('.chip')) c.classList.remove('selected');
    chip.classList.add('selected');
    customMin.value = '';
    sitMinutes = parseInt(chip.textContent, 10);
  });

  customMin.addEventListener('input', () => {
    const v = parseInt(customMin.value, 10);
    for (const c of document.querySelectorAll('.chip')) c.classList.remove('selected');
    if (v > 0) {
      customMin.classList.add('selected');
      sitMinutes = v;
    } else {
      document.querySelectorAll('button.chip')[3].classList.add('selected');
      sitMinutes = 30;
    }
  });

  /* ————— sit history calendar ————— */

  const historyBtn = document.getElementById('history-btn');
  const historyPanel = document.getElementById('history-panel');
  const calTitle = document.getElementById('cal-title');
  const calGrid = document.getElementById('cal-grid');

  let calYear, calMonth;   // currently displayed month

  function localISO(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  async function loadCalendar() {
    const last = new Date(calYear, calMonth + 1, 0).getDate();
    calTitle.textContent = new Date(calYear, calMonth, 1)
      .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    let days = {};
    try {
      const data = await api('/api/morning/sits?start=' + localISO(calYear, calMonth, 1)
        + '&end=' + localISO(calYear, calMonth, last)
        + '&timezone=' + encodeURIComponent(timezone));
      days = data.days || {};
    } catch (err) { /* render empty month; toggling will surface errors */ }

    calGrid.replaceChildren();
    for (const dow of ['S', 'M', 'T', 'W', 'T', 'F', 'S']) {
      const el = document.createElement('div');
      el.className = 'dow';
      el.textContent = dow;
      calGrid.appendChild(el);
    }
    const firstDow = new Date(calYear, calMonth, 1).getDay();
    for (let i = 0; i < firstDow; i++) calGrid.appendChild(document.createElement('div'));

    const now = new Date();
    const todayISO = localISO(now.getFullYear(), now.getMonth(), now.getDate());
    for (let d = 1; d <= last; d++) {
      const iso = localISO(calYear, calMonth, d);
      const cell = document.createElement('button');
      cell.className = 'day';
      cell.textContent = d;
      const minutes = days[iso] || 0;
      if (minutes) {
        cell.classList.add('sat');
        cell.title = minutes + ' min';
      }
      if (iso === todayISO) cell.classList.add('today');
      if (iso > todayISO) cell.classList.add('future');
      cell.addEventListener('click', async () => {
        cell.disabled = true;
        try {
          const res = await postJSON('/api/morning/sits/toggle',
            { date: iso, sit_minutes: sitMinutes, timezone });
          cell.classList.toggle('sat', res.minutes > 0);
          cell.title = res.minutes ? res.minutes + ' min' : '';
        } catch (err) {
          cell.textContent = '!';
        } finally {
          cell.disabled = false;
        }
      });
      calGrid.appendChild(cell);
    }
  }

  historyBtn.addEventListener('click', () => {
    if (historyPanel.hidden) {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      historyPanel.hidden = false;
      loadCalendar();
    } else {
      historyPanel.hidden = true;
    }
  });

  document.getElementById('cal-prev').addEventListener('click', () => {
    calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
    loadCalendar();
  });

  document.getElementById('cal-next').addEventListener('click', () => {
    calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
    loadCalendar();
  });

  /* ————— timer ————— */

  let remaining = 0, tick = null;

  function renderCountdown() {
    const m = Math.floor(remaining / 60), s = remaining % 60;
    countdown.textContent = `${m}:${String(s).padStart(2, '0')}`;
  }

  function lastAssistantLine() {
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role !== 'assistant') continue;
      const blocks = String(messages[i].content || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      return blocks.length ? blocks[blocks.length - 1] : '';
    }
    return '';
  }

  document.getElementById('play').addEventListener('click', () => {
    clearInterval(tick);
    remaining = sitMinutes * 60;
    renderCountdown();
    intention.textContent = lastAssistantLine();
    overlay.classList.add('on');
    tick = setInterval(() => {
      remaining = Math.max(0, remaining - 1);
      renderCountdown();
      if (remaining === 0) { clearInterval(tick); chime(); }
    }, 1000);
  });

  function chime() {
    if (!document.hasFocus()) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 528;
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 4);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 4);
  }

  overlay.addEventListener('click', () => {
    clearInterval(tick);
    overlay.classList.remove('on');
  });

  init();
</script>
</body>
</html>
