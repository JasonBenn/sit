<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sit</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#FAF7F1">
<style>
  :root {
    --ink: #2A2723;
    --ink-soft: #55503F;
    --ink-faded: #877F72;
    --paper: #FAF7F1;
    --paper-raised: #F3EEE3;
    --hairline: #E4DDCE;
    --hairline-strong: #CFC6B2;
    --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --sans: 'Outfit', -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    font-weight: 300;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    max-width: 1280px;
    height: 100vh;
    margin: 0 auto;
  }

  .divider { background: var(--hairline-strong); }

  /* ————— left: conversation ————— */

  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  .pane-header {
    position: relative;   /* anchors the history calendar popover */
    padding: 28px 40px 18px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .pane-header h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .pane-header .sub {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
  }

  .session-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .session-nav .pager {
    font-size: 13px;
    color: var(--ink-faded);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .session-nav button {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 5px 12px;
    cursor: pointer;
  }

  button:disabled { opacity: 0.35; cursor: default; }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 28px 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .msg { max-width: 92%; }

  .msg .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin-bottom: 6px;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 14px 18px;
  }

  .msg.assistant { align-self: flex-start; }

  .msg p + p { margin-top: 10px; }

  .msg a, .tool a, .entry a {
    color: var(--ink-soft);
    text-decoration: underline;
    text-decoration-color: var(--hairline-strong);
    text-underline-offset: 2px;
    overflow-wrap: anywhere;
  }

  .msg .pending { color: var(--ink-faded); letter-spacing: 0.2em; }

  .notice {
    align-self: flex-start;
    font-size: 14px;
    font-style: italic;
    color: var(--ink-faded);
  }

  /* tool call chips */
  .tool {
    align-self: flex-start;
    border-left: 2px solid var(--hairline-strong);
    padding: 6px 0 6px 16px;
    max-width: 92%;
  }

  .tool .tool-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
  }

  .tool .tool-body {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 3px;
  }

  /* sit row: duration chips + add-sit, above the composer */
  .sit-row {
    border-top: 1px solid var(--hairline);
    padding: 12px 40px 0;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .sit-row .sit-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    margin-right: 4px;
  }

  .sit-row .durations { display: flex; gap: 8px; }

  .sit-row .add-sit {
    margin-left: auto;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 8px 14px;
    cursor: pointer;
  }

  /* sit marker: the widget pinned into the conversation when a sit is logged */
  .sit-marker {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 4px 0;
  }

  .sit-marker::before, .sit-marker::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--hairline-strong);
  }

  .sit-marker .sit-mins {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
  }

  .sit-marker .sit-timer {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 5px 12px;
    cursor: pointer;
  }

  .chip {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 8px 16px;
    cursor: pointer;
  }

  .chip.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .chip-custom {
    width: 58px;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .chip-custom::-webkit-outer-spin-button,
  .chip-custom::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .chip-custom::placeholder { color: var(--ink-faded); }

  .chip-custom.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* sit history calendar */
  .history-panel {
    position: absolute;
    top: calc(100% + 1px);
    right: 40px;
    z-index: 5;
    background: var(--paper);
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 16px 18px 12px;
    width: 292px;
  }

  .cal-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .cal-head .cal-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
  }

  .cal-head button {
    font-size: 15px;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 0 8px;
    cursor: pointer;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-grid .dow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faded);
    text-align: center;
    padding: 3px 0 5px;
  }

  .cal-grid .day {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    text-align: center;
    line-height: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--sans);
    font-weight: 300;
  }

  .cal-grid .day:hover { background: var(--paper-raised); }

  .cal-grid .day.sat {
    background: var(--ink);
    color: var(--paper);
  }

  /* e-ink legible: today is a thick ring; a sat today keeps the fill and
     gains an inner paper ring so it reads distinctly from other sat days */
  .cal-grid .day.today {
    box-shadow: inset 0 0 0 2px var(--ink);
    font-weight: 500;
  }

  .cal-grid .day.sat.today {
    box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px var(--paper);
  }

  .cal-grid .day.future {
    color: var(--hairline-strong);
    pointer-events: none;
  }

  .cal-hint {
    font-size: 11px;
    color: var(--ink-faded);
    margin-top: 10px;
    text-align: center;
  }

  /* composer (the sit row above it carries the separating border) */
  .composer {
    padding: 14px 40px 24px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
  }

  /* textarea (1 line) and button are both 36px tall, so flex-end lines them up */
  .composer textarea {
    flex: 1;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 300;
    color: var(--ink);
    background: none;
    border: none;
    outline: none;
    resize: none;
    line-height: 1.5;
    padding: 6px 0;
    max-height: 40vh;
    overflow-y: auto;
  }

  .composer textarea::placeholder { color: var(--ink-faded); }

  .composer .send {
    font-size: 13px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 9px 18px;
    cursor: pointer;
  }

  /* ————— right: wake-up log ————— */

  .log-wrap {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .log-scroll {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 28px 28px 40px 40px;
  }

  .entry li, .entry p { overflow-wrap: anywhere; }

  /* outline rail */
  .outline {
    width: 208px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 22px 18px 40px 16px;
    border-left: 1px solid var(--hairline);
    scrollbar-width: thin;
  }

  .outline a {
    display: block;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink-faded);
    text-decoration: none;
    padding: 4px 0;
    cursor: pointer;
  }

  .outline a .odate {
    font-variant-numeric: tabular-nums;
    margin-right: 5px;
  }

  .outline a:hover { color: var(--ink-soft); }
  .outline a.active { color: var(--ink); }

  .log-wrap.outline-hidden .outline { display: none; }

  .outline-toggle {
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faded);
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 4px 10px;
    cursor: pointer;
  }

  .outline-toggle.on {
    color: var(--ink-soft);
    border-color: var(--hairline-strong);
  }

  .entry { padding: 22px 0; border-bottom: 1px solid var(--hairline); }
  .entry:first-child { padding-top: 4px; }

  .entry .date {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-faded);
    margin-bottom: 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .entry .fresh {
    border: 1px solid var(--hairline-strong);
    border-radius: 2px;
    padding: 1px 8px;
    font-size: 10px;
  }

  .entry h2 {
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 500;
    line-height: 1.25;
    margin-bottom: 10px;
    text-wrap: balance;
  }

  .entry ul { list-style: none; }

  .entry li {
    font-size: 15px;
    color: var(--ink-soft);
    padding-left: 26px;
    position: relative;
    margin-bottom: 7px;
  }

  .entry li .marker {
    position: absolute;
    left: 0;
    color: var(--ink-faded);
    font-variant-numeric: tabular-nums;
  }

  .entry li.done { color: var(--ink-faded); }
  .entry li.done .item-text { text-decoration: line-through; }

  .entry p {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  .entry li strong, .entry p strong { font-weight: 500; color: var(--ink); }

  .log-scroll .notice { display: block; padding-top: 4px; }

  /* ————— timer overlay ————— */

  .timer-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    cursor: pointer;
    z-index: 10;
  }

  .timer-overlay.on { display: flex; }

  .timer-overlay .countdown {
    font-family: var(--serif);
    font-size: 190px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .timer-overlay .intention {
    font-family: var(--serif);
    font-style: italic;
    font-size: 24px;
    color: var(--ink-soft);
    max-width: 560px;
    text-align: center;
    text-wrap: balance;
  }

  .timer-overlay .intention:empty { display: none; }

  .timer-overlay .hint {
    position: fixed;
    bottom: 36px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-faded);
  }

  /* ————— mobile: one pane at a time, tabs to switch ————— */

  .mobile-tabs { display: none; }

  @media (max-width: 900px) {
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    .divider { display: none; }

    .mobile-tabs {
      display: flex;
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--hairline);
    }

    .mobile-tabs button {
      flex: 1;
      font-family: var(--sans);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-faded);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 13px 0 11px;
      cursor: pointer;
    }

    .mobile-tabs button.active {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .pane { flex: 1; }
    .app.show-log .pane:first-of-type { display: none; }
    .app:not(.show-log) .pane:last-of-type { display: none; }

    /* the tab bar already names the log; its header is redundant */
    .pane:last-of-type .pane-header { display: none; }

    .pane-header {
      padding: 16px 20px 12px;
      flex-wrap: wrap;
      gap: 6px 12px;
    }

    .pane-header h1 { font-size: 24px; }

    .sit-row {
      padding: 10px 20px 0;
      flex-wrap: wrap;
      row-gap: 8px;
    }

    .chip { padding: 8px 13px; }

    .chip-custom { font-size: 16px; } /* <16px inputs trigger iOS zoom-on-focus */

    .history-panel {
      left: 20px;
      right: 20px;
      width: auto;
    }

    .chat-scroll { padding: 20px; gap: 18px; }

    .composer {
      padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
    }

    .log-scroll { padding: 20px 20px 40px; }

    /* the outline becomes a right tray over the log — swipe left to open, right to close */
    .outline-toggle { display: none; }
    .log-wrap { position: relative; overflow: hidden; }
    .log-wrap.outline-hidden .outline { display: block; }
    .outline {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: min(78vw, 300px);
      background: var(--paper);
      box-shadow: -10px 0 22px rgba(0, 0, 0, 0.07);
      transform: translateX(102%);
      transition: transform 0.22s ease;
    }
    .log-wrap.outline-open .outline { transform: translateX(0); }

    .timer-overlay .countdown { font-size: min(150px, 26vw); }
    .timer-overlay .intention { font-size: 20px; padding: 0 24px; }
  }
</style>
</head>
<body>

<div class="app">

  <nav class="mobile-tabs">
    <button class="active" data-view="chat">Check in</button>
    <button data-view="log">Wake up log</button>
  </nav>

  <!-- ——— LEFT: conversation ——— -->
  <section class="pane">
    <header class="pane-header">
      <h1 id="today"></h1>
      <div class="session-nav">
        <button id="prev" title="Previous session">‹</button>
        <span class="pager" id="pager"></span>
        <button id="next" title="Next session">›</button>
        <button id="new-session">New</button>
        <button id="history-btn" title="Sit history — tap a day to backfill">history</button>
      </div>

      <div class="history-panel" id="history-panel" hidden>
        <div class="cal-head">
          <button id="cal-prev" title="Previous month">‹</button>
          <span class="cal-title" id="cal-title"></span>
          <button id="cal-next" title="Next month">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-hint">tap a day to toggle a sit — uses the selected duration</div>
      </div>
    </header>

    <div class="chat-scroll" id="chat"></div>

    <div class="sit-row">
      <span class="sit-label">Sat for</span>
      <div class="durations" id="durations">
        <button class="chip">5</button>
        <button class="chip">10</button>
        <button class="chip">20</button>
        <button class="chip selected">30</button>
        <button class="chip">40</button>
        <input class="chip chip-custom" id="custom-min" type="number" min="1" max="600" placeholder="…">
      </div>
      <button class="add-sit" id="add-sit" title="Log this sit into the conversation">+ Add sit</button>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Check in…"></textarea>
      <button class="send" id="send">Send</button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- ——— RIGHT: wake-up log ——— -->
  <section class="pane">
    <header class="pane-header">
      <h1>Wake up log</h1>
      <button class="outline-toggle" id="outline-toggle" title="Show or hide the outline">outline</button>
    </header>

    <div class="log-wrap">
      <div class="log-scroll" id="journal"></div>
      <nav class="outline" id="outline"></nav>
    </div>
  </section>
</div>

<div class="timer-overlay" id="overlay">
  <div class="countdown" id="countdown">30:00</div>
  <div class="intention" id="intention"></div>
  <div class="hint">tap anywhere to end</div>
</div>

<script>
  const chat = document.getElementById('chat');
  const journalPane = document.getElementById('journal');
  const outlinePane = document.getElementById('outline');
  const pager = document.getElementById('pager');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const newBtn = document.getElementById('new-session');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const addSitBtn = document.getElementById('add-sit');
  const overlay = document.getElementById('overlay');
  const countdown = document.getElementById('countdown');
  const intention = document.getElementById('intention');

  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

  let sitMinutes = 30;
  let sessions = [];
  let index = -1;
  let messages = [];
  let busy = false;

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return res.json();
  }

  function postJSON(path, body) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  /* ————— rendering ————— */

  const URL_RE = /https?:\/\/[^\s<>()"']+[^\s<>()"'.,;:!?]/g;

  function linkNode(url, label) {
    const a = document.createElement('a');
    a.href = url;
    a.textContent = label || url;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  function appendLinkified(parent, text) {
    let last = 0;
    for (const m of text.matchAll(URL_RE)) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      parent.appendChild(linkNode(m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function paragraphs(parent, text) {
    const blocks = String(text || '').split(/\n\s*\n/);
    for (const block of blocks) {
      const trimmed = block.trim();
      if (!trimmed) continue;
      const p = document.createElement('p');
      appendLinkified(p, trimmed);
      parent.appendChild(p);
    }
  }

  function messageNode(msg) {
    if (msg.role === 'sit') {
      const el = document.createElement('div');
      el.className = 'sit-marker';
      const mins = document.createElement('span');
      mins.className = 'sit-mins';
      mins.textContent = msg.content + '-minute sit';
      const btn = document.createElement('button');
      btn.className = 'sit-timer';
      btn.textContent = '▶ timer';
      btn.title = 'Optional: count down, chime at the end';
      btn.addEventListener('click', () => startTimer(parseInt(msg.content, 10), msg));
      el.append(mins, btn);
      return el;
    }

    if (msg.role === 'tool') {
      const el = document.createElement('div');
      el.className = 'tool';
      const label = document.createElement('div');
      label.className = 'tool-label';
      label.textContent = msg.tool_label || 'Tool';
      const body = document.createElement('div');
      body.className = 'tool-body';
      appendLinkified(body, msg.content || '');
      el.append(label, body);
      return el;
    }

    const el = document.createElement('div');
    el.className = 'msg ' + (msg.role === 'user' ? 'user' : 'assistant');
    if (msg.role !== 'user') {
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = 'Sit';
      el.appendChild(who);
    }
    paragraphs(el, msg.content);
    return el;
  }

  function pendingNode() {
    const el = document.createElement('div');
    el.className = 'msg assistant';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = 'Sit';
    const dots = document.createElement('p');
    dots.className = 'pending';
    dots.textContent = '…';
    el.append(who, dots);
    return el;
  }

  function noticeNode(text) {
    const el = document.createElement('div');
    el.className = 'notice';
    el.textContent = text;
    return el;
  }

  function scrollChat() {
    chat.scrollTop = chat.scrollHeight;
  }

  function renderChat(extra) {
    chat.replaceChildren();
    for (const msg of messages) chat.appendChild(messageNode(msg));
    if (extra) chat.appendChild(extra);
    scrollChat();
  }

  function renderPager() {
    pager.textContent = sessions.length
      ? (index + 1) + '/' + sessions.length
      : '—';
    prevBtn.disabled = busy || index <= 0;
    nextBtn.disabled = busy || index < 0 || index >= sessions.length - 1;
    newBtn.disabled = busy;
  }

  function setBusy(state) {
    busy = state;
    input.disabled = state;
    sendBtn.disabled = state;
    addSitBtn.disabled = state;
    renderPager();
  }

  /* ————— journal ————— */

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function inlineMarkdown(text) {
    // Anchors are stashed as \x00N\x00 tokens so the emphasis regexes below
    // can't mangle characters inside URLs (underscores, asterisks).
    const anchors = [];
    const stash = (url, label) => {
      anchors.push('<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>');
      return '\x00' + (anchors.length - 1) + '\x00';
    };
    return escapeHtml(text)
      .replace(/\[\[([^\]]+)\]\]/g, '$1')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => stash(url, label))
      .replace(URL_RE, url => stash(url, url))
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      .replace(/^\s*#{1,6}\s+/, '')
      .replace(/\x00(\d+)\x00/g, (_, i) => anchors[i]);
  }

  function todayLabel() {
    return new Date().toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  function entryNode(entry) {
    const article = document.createElement('article');
    article.className = 'entry';

    const date = document.createElement('div');
    date.className = 'date';
    date.append(document.createTextNode(entry.date || ''));
    if (entry.date === todayLabel()) {
      const pill = document.createElement('span');
      pill.className = 'fresh';
      pill.textContent = 'just written';
      date.appendChild(pill);
    }
    article.appendChild(date);

    const h2 = document.createElement('h2');
    h2.textContent = entry.title || '';
    article.appendChild(h2);

    let list = null;
    for (const raw of String(entry.body || '').split('\n')) {
      if (!raw.trim()) { list = null; continue; }
      const item = raw.match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
      if (item) {
        if (!list) {
          list = document.createElement('ul');
          article.appendChild(list);
        }
        const tabs = (item[1].match(/\t/g) || []).length;
        const depth = tabs || Math.floor(item[1].length / 2);
        let marker = /^\d/.test(item[2]) ? item[2] : '–';
        let text = item[3];
        const li = document.createElement('li');
        const box = text.match(/^\[( |x|X)\]\s*(.*)$/);
        if (box) {
          marker = box[1].trim() ? '☑' : '☐';
          text = box[2];
          if (box[1].trim()) li.className = 'done';
        }
        if (depth) li.style.marginLeft = (depth * 22) + 'px';
        const markerEl = document.createElement('span');
        markerEl.className = 'marker';
        markerEl.textContent = marker;
        const textEl = document.createElement('span');
        textEl.className = 'item-text';
        textEl.innerHTML = inlineMarkdown(text);
        li.append(markerEl, textEl);
        list.appendChild(li);
      } else {
        list = null;
        const p = document.createElement('p');
        p.innerHTML = inlineMarkdown(raw.trim());
        article.appendChild(p);
      }
    }
    return article;
  }

  function outlineItem(entry, i) {
    const a = document.createElement('a');
    const date = document.createElement('span');
    date.className = 'odate';
    date.textContent = entry.raw_date || '';
    a.append(date, document.createTextNode(entry.title || ''));
    a.addEventListener('click', () => {
      const target = document.getElementById('entry-' + i);
      if (target) {
        journalPane.scrollTop += target.getBoundingClientRect().top
          - journalPane.getBoundingClientRect().top - 12;
      }
      logWrap.classList.remove('outline-open');  // tray overlays the log on mobile
    });
    return a;
  }

  function trackOutline() {
    const entries = [...journalPane.querySelectorAll('.entry')];
    const links = [...outlinePane.querySelectorAll('a')];
    let ticking = false;
    function update() {
      ticking = false;
      const top = journalPane.getBoundingClientRect().top + 90;
      let active = 0;
      for (let i = 0; i < entries.length; i++) {
        if (entries[i].getBoundingClientRect().top <= top) active = i; else break;
      }
      links.forEach((a, i) => a.classList.toggle('active', i === active));
      const link = links[active];
      if (link) {
        const r = link.getBoundingClientRect(), o = outlinePane.getBoundingClientRect();
        if (r.top < o.top || r.bottom > o.bottom) {
          outlinePane.scrollTop += r.top - o.top - o.height / 2;
        }
      }
    }
    journalPane.addEventListener('scroll', () => {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    });
    update();
  }

  async function loadJournal() {
    journalPane.replaceChildren();
    outlinePane.replaceChildren();
    try {
      const data = await api('/api/morning/journal');
      const entries = data.entries || [];
      if (!entries.length) {
        journalPane.appendChild(noticeNode('No entries yet.'));
        return;
      }
      entries.forEach((entry, i) => {
        const node = entryNode(entry);
        node.id = 'entry-' + i;
        journalPane.appendChild(node);
        outlinePane.appendChild(outlineItem(entry, i));
      });
      trackOutline();
    } catch (err) {
      journalPane.appendChild(noticeNode('Could not load the log — ' + err.message));
    }
  }

  /* ————— sessions ————— */

  async function openSession(i) {
    index = i;
    renderPager();
    renderChat(pendingNode());
    try {
      const data = await api('/api/morning/sessions/' + encodeURIComponent(sessions[i].id) + '/messages');
      messages = data.messages || [];
      renderChat();
    } catch (err) {
      messages = [];
      renderChat(noticeNode('Could not load this session — ' + err.message));
    }
  }

  async function startSession() {
    setBusy(true);
    renderChat(pendingNode());
    try {
      const data = await postJSON('/api/morning/sessions', { timezone });
      sessions.push(data.session);
      index = sessions.length - 1;
      messages = data.messages || [];
      renderChat();
    } catch (err) {
      messages = [];
      renderChat(noticeNode('Could not start a session — ' + err.message));
    } finally {
      setBusy(false);
    }
  }

  const TOOL_PENDING_LABELS = {
    ask_notebooklm: 'Asking Rigdzin notebook…',
    write_journal_entry: 'Writing journal entry…',
  };

  function updateToolChip(chip, label, content) {
    chip.querySelector('.tool-label').textContent = label;
    const body = chip.querySelector('.tool-body');
    body.replaceChildren();
    appendLinkified(body, content || '');
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy || index < 0) return;
    input.value = '';
    autosize();
    messages.push({ id: 'local-' + Date.now(), role: 'user', content: text });
    setBusy(true);
    const pending = pendingNode();
    renderChat(pending);

    // Streamed turn: text deltas fill an in-progress bubble; tool events add chips.
    let streamMsg = null, streamWho = null, streamText = '';
    const toolChips = [];
    let execIdx = 0;
    let done = null;

    function handleEvent(ev) {
      pending.remove();
      if (ev.type === 'text') {
        if (!streamMsg) {
          streamMsg = document.createElement('div');
          streamMsg.className = 'msg assistant';
          streamWho = document.createElement('div');
          streamWho.className = 'who';
          streamWho.textContent = 'Sit';
          streamMsg.appendChild(streamWho);
          streamText = '';
          chat.appendChild(streamMsg);
        }
        streamText += ev.delta;
        streamMsg.replaceChildren(streamWho);
        paragraphs(streamMsg, streamText);
      } else if (ev.type === 'tool_pending') {
        streamMsg = null;  // any following text starts a fresh bubble
        const chip = messageNode({
          role: 'tool',
          tool_label: TOOL_PENDING_LABELS[ev.name] || ev.name,
          content: '',
        });
        toolChips.push(chip);
        chat.appendChild(chip);
      } else if (ev.type === 'tool') {
        if (toolChips[execIdx]) updateToolChip(toolChips[execIdx], ev.tool_label, ev.content);
      } else if (ev.type === 'tool_done') {
        const chip = toolChips[execIdx];
        if (chip) updateToolChip(chip, ev.message.tool_label, ev.message.content);
        else chat.appendChild(messageNode(ev.message));
        execIdx++;
      } else if (ev.type === 'done') {
        done = ev;
      }
      scrollChat();
    }

    try {
      const res = await fetch(
        '/api/morning/sessions/' + encodeURIComponent(sessions[index].id) + '/chat',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, timezone }),
        }
      );
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done: eof } = await reader.read();
        if (eof) break;
        buf += decoder.decode(value, { stream: true });
        const chunks = buf.split('\n\n');
        buf = chunks.pop();
        for (const chunk of chunks) {
          for (const line of chunk.split('\n')) {
            if (line.startsWith('data: ')) handleEvent(JSON.parse(line.slice(6)));
          }
        }
      }
      if (!done) throw new Error('the reply was cut off');

      messages = messages.concat(done.messages || []);
      renderChat();
      if (done.journal_written) {
        sessions[index].journal_written_at = new Date().toISOString();
        loadJournal();
      }
    } catch (err) {
      pending.remove();
      chat.appendChild(noticeNode('Message failed — ' + err.message));
      scrollChat();
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  async function init() {
    const now = new Date();
    document.getElementById('today').textContent =
      now.toLocaleDateString('en-US', { weekday: 'short' })
      + ' ' + (now.getMonth() + 1) + '/' + now.getDate();
    renderPager();
    renderChat(pendingNode());

    try {
      const data = await api('/api/morning/sessions');
      sessions = data.sessions || [];
    } catch (err) {
      renderChat(noticeNode('Could not reach the server — ' + err.message));
      renderPager();
      loadJournal();
      return;
    }

    const latest = sessions[sessions.length - 1];
    if (!latest || latest.journal_written_at) {
      await startSession();
    } else {
      await openSession(sessions.length - 1);
    }
    loadJournal();
  }

  /* ————— events ————— */

  prevBtn.addEventListener('click', () => { if (index > 0) openSession(index - 1); });
  nextBtn.addEventListener('click', () => { if (index < sessions.length - 1) openSession(index + 1); });
  newBtn.addEventListener('click', startSession);
  sendBtn.addEventListener('click', send);

  function autosize() {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  }
  input.addEventListener('input', autosize);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  const app = document.querySelector('.app');
  const mobileTabs = document.querySelectorAll('.mobile-tabs button');

  for (const btn of mobileTabs) {
    btn.addEventListener('click', () => {
      app.classList.toggle('show-log', btn.dataset.view === 'log');
      for (const b of mobileTabs) b.classList.toggle('active', b === btn);
    });
  }

  const logWrap = document.querySelector('.log-wrap');
  const outlineToggle = document.getElementById('outline-toggle');

  function setOutlineVisible(visible) {
    logWrap.classList.toggle('outline-hidden', !visible);
    outlineToggle.classList.toggle('on', visible);
    localStorage.setItem('outlineVisible', visible ? '1' : '0');
  }

  outlineToggle.addEventListener('click', () => {
    setOutlineVisible(logWrap.classList.contains('outline-hidden'));
  });

  setOutlineVisible(localStorage.getItem('outlineVisible') !== '0');

  /* mobile: swipe left anywhere on the log to open the outline tray, right to close */
  const logPane = document.querySelector('section.pane:last-of-type');
  let touchStart = null;

  logPane.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  logPane.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    logWrap.classList.toggle('outline-open', dx < 0);
  }, { passive: true });

  const customMin = document.getElementById('custom-min');

  document.getElementById('durations').addEventListener('click', e => {
    const chip = e.target.closest('button.chip');
    if (!chip) return;
    for (const c of document.querySelectorAll('.chip')) c.classList.remove('selected');
    chip.classList.add('selected');
    customMin.value = '';
    sitMinutes = parseInt(chip.textContent, 10);
  });

  customMin.addEventListener('input', () => {
    const v = parseInt(customMin.value, 10);
    for (const c of document.querySelectorAll('.chip')) c.classList.remove('selected');
    if (v > 0) {
      customMin.classList.add('selected');
      sitMinutes = v;
    } else {
      document.querySelectorAll('button.chip')[3].classList.add('selected');
      sitMinutes = 30;
    }
  });

  /* ————— sit history calendar ————— */

  const historyBtn = document.getElementById('history-btn');
  const historyPanel = document.getElementById('history-panel');
  const calTitle = document.getElementById('cal-title');
  const calGrid = document.getElementById('cal-grid');

  let calYear, calMonth;   // currently displayed month

  function localISO(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  async function loadCalendar() {
    const last = new Date(calYear, calMonth + 1, 0).getDate();
    calTitle.textContent = new Date(calYear, calMonth, 1)
      .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    let days = {};
    try {
      const data = await api('/api/morning/sits?start=' + localISO(calYear, calMonth, 1)
        + '&end=' + localISO(calYear, calMonth, last)
        + '&timezone=' + encodeURIComponent(timezone));
      days = data.days || {};
    } catch (err) { /* render empty month; toggling will surface errors */ }

    calGrid.replaceChildren();
    for (const dow of ['S', 'M', 'T', 'W', 'T', 'F', 'S']) {
      const el = document.createElement('div');
      el.className = 'dow';
      el.textContent = dow;
      calGrid.appendChild(el);
    }
    const firstDow = new Date(calYear, calMonth, 1).getDay();
    for (let i = 0; i < firstDow; i++) calGrid.appendChild(document.createElement('div'));

    const now = new Date();
    const todayISO = localISO(now.getFullYear(), now.getMonth(), now.getDate());
    for (let d = 1; d <= last; d++) {
      const iso = localISO(calYear, calMonth, d);
      const cell = document.createElement('button');
      cell.className = 'day';
      cell.textContent = d;
      const minutes = days[iso] || 0;
      if (minutes) {
        cell.classList.add('sat');
        cell.title = minutes + ' min';
      }
      if (iso === todayISO) cell.classList.add('today');
      if (iso > todayISO) cell.classList.add('future');
      cell.addEventListener('click', async () => {
        cell.disabled = true;
        try {
          const res = await postJSON('/api/morning/sits/toggle',
            { date: iso, sit_minutes: sitMinutes, timezone });
          cell.classList.toggle('sat', res.minutes > 0);
          cell.title = res.minutes ? res.minutes + ' min' : '';
        } catch (err) {
          cell.textContent = '!';
        } finally {
          cell.disabled = false;
        }
      });
      calGrid.appendChild(cell);
    }
  }

  historyBtn.addEventListener('click', () => {
    if (historyPanel.hidden) {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      historyPanel.hidden = false;
      loadCalendar();
    } else {
      historyPanel.hidden = true;
    }
  });

  document.getElementById('cal-prev').addEventListener('click', () => {
    calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
    loadCalendar();
  });

  document.getElementById('cal-next').addEventListener('click', () => {
    calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
    loadCalendar();
  });

  /* ————— add sit: pin a sit marker into the conversation, no model turn ————— */

  addSitBtn.addEventListener('click', async () => {
    if (busy || index < 0) return;
    addSitBtn.disabled = true;
    try {
      const data = await postJSON(
        '/api/morning/sessions/' + encodeURIComponent(sessions[index].id) + '/sits',
        { sit_minutes: sitMinutes, timezone });
      messages.push(data.message);
      renderChat();
    } catch (err) {
      chat.appendChild(noticeNode('Could not log the sit — ' + err.message));
      scrollChat();
    } finally {
      addSitBtn.disabled = false;
    }
  });

  /* ————— timer ————— */

  let remaining = 0, tick = null;

  function renderCountdown() {
    const m = Math.floor(remaining / 60), s = remaining % 60;
    countdown.textContent = `${m}:${String(s).padStart(2, '0')}`;
  }

  /* the intention shown on the overlay: the last thing Sit said before this sit */
  function lastAssistantLineBefore(sitMsg) {
    let end = messages.indexOf(sitMsg);
    if (end < 0) end = messages.length;
    for (let i = end - 1; i >= 0; i--) {
      if (messages[i].role !== 'assistant') continue;
      const blocks = String(messages[i].content || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      return blocks.length ? blocks[blocks.length - 1] : '';
    }
    return '';
  }

  function startTimer(minutes, sitMsg) {
    clearInterval(tick);
    remaining = minutes * 60;
    renderCountdown();
    intention.textContent = lastAssistantLineBefore(sitMsg);
    overlay.classList.add('on');
    tick = setInterval(() => {
      remaining = Math.max(0, remaining - 1);
      renderCountdown();
      if (remaining === 0) { clearInterval(tick); chime(); }
    }, 1000);
  }

  function chime() {
    if (!document.hasFocus()) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 528;
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 4);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 4);
  }

  overlay.addEventListener('click', () => {
    clearInterval(tick);
    overlay.classList.remove('on');
  });

  init();
</script>
</body>
</html>
