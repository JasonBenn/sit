  /* Start on a proposal card: adopt its params, log the sit, play it. */
  async function startProposal(msg, btn) {
    if (busy || index < 0) return;
    btn.disabled = true;
    playSilence();            // while the tap is still the current gesture
    ensureMediaElements();
    const params = msg.data || {};
    try {
      await fetchComponents();   // so a component added this turn can be named
      applyRoutine({
        warmup_slugs: params.warmup_slugs || [],
        sit_slug: params.sit_slug || DEFAULT_SIT_SLUG,
      });

        applyMinutes(params.sit_minutes);

      chat.appendChild(noticeNode('Could not start the routine — ' + err.message));

  /* ————— runner ————— */

  function renderCountdown(seconds) {
    const m = Math.floor(seconds / 60), s = seconds % 60;
    countdown.textContent = `${m}:${String(s).padStart(2, '0')}`;
  }

  /* fallback intention if the generated one fails: the last thing Sit said before this sit */
  function lastAssistantLineBefore(sitMsg) {
    let end = messages.indexOf(sitMsg);
    if (end < 0) end = messages.length;
    for (let i = end - 1; i >= 0; i--) {
      if (messages[i].role !== 'assistant') continue;
      const blocks = String(messages[i].content || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      return blocks.length ? blocks[blocks.length - 1] : '';
    }
    return '';
  }

  /* Stream a generated intention into a buffer when the runner opens, so it's
     ready by the time the seated step arrives; paintIntention shows it there. */
  let intentionAbort = null;
  let intentionText = '';

  function paintIntention() {
    const item = runner.playlist[runner.i];
    if (!item) return;
    const own = (item.step.text || '').trim();
    // A step's own guidance *is* that step's intention — they are the same slot.
    // Only a step without its own text gets the generated line, and never a warm-up.
    const generated = (!own && item.component.kind !== 'warmup') ? intentionText : '';
    runnerText.textContent = own || generated;
    runnerText.classList.toggle('generated', !own && !!generated);
  }

  async function streamIntention(sitMsg) {
    if (intentionAbort) intentionAbort.abort();
    const ctrl = new AbortController();
    intentionAbort = ctrl;
    intentionText = '';
    paintIntention();
    try {
      const res = await fetch(
        '/api/morning/sessions/' + encodeURIComponent(sessions[index].id)
          + '/intention?timezone=' + encodeURIComponent(timezone)
          + '&before=' + encodeURIComponent(sitMsg.id),
        { signal: ctrl.signal }
      );
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done: eof } = await reader.read();
        if (eof) break;
        buf += decoder.decode(value, { stream: true });
        const chunks = buf.split('\n\n');
        buf = chunks.pop();
        for (const chunk of chunks) {
          for (const line of chunk.split('\n')) {
            if (!line.startsWith('data: ')) continue;
            const ev = JSON.parse(line.slice(6));
            if (ev.type === 'text') { intentionText += ev.delta; paintIntention(); }
          }
        }
      }
      // A stream that opens and then yields nothing leaves an unguided sit with an
      // empty guidance slot; the last thing said in the check-in is better than blank.
      if (!intentionText.trim()) {
        intentionText = lastAssistantLineBefore(sitMsg);
        paintIntention();
      }
    } catch (err) {
      if (!ctrl.signal.aborted) {
        intentionText = lastAssistantLineBefore(sitMsg);
        paintIntention();
      }
    }
  }

  /* ————— keep-alive and bells —————
     iOS stops running our JS behind the lock screen unless the page is playing
     media, so a near-silent loop starts inside the start tap and runs for the
     whole program. The bells ride on that same element as a track swap: it
     already holds playback permission from the gesture, so it rings while the
     phone is locked — which an AudioContext beep could not. */

  function wavUrl(rate, samples) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 32767, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  /* pure digital silence can get the audio session suspended; a -60dB hiss keeps it alive */
  const silenceUrl = (() => {
    const rate = 8000, samples = new Float32Array(rate * 10);
    for (let i = 0; i < samples.length; i++) samples[i] = (Math.random() * 2 - 1) * 0.001;
    return wavUrl(rate, samples);
  })();

  function bellUrl(secs) {
    const rate = 22050, samples = new Float32Array(rate * secs);
    for (let i = 0; i < samples.length; i++) {
      const t = i / rate;
      samples[i] = Math.sin(2 * Math.PI * 528 * t) * 0.4 * Math.pow(0.001 / 0.4, t / secs);
    }
    return wavUrl(rate, samples);
  }

  const BELL_URL = { soft: bellUrl(1.2), long: bellUrl(4) };

  const keepAlive = new Audio();
  keepAlive.addEventListener('ended', playSilence);   // a bell hands it back

  function playSilence() {
    keepAlive.loop = true;
    keepAlive.src = silenceUrl;
    keepAlive.play().catch(() => {});
  }

  function bell(kind) {
    if (kind === 'none') return;
    keepAlive.loop = false;
    keepAlive.src = BELL_URL[kind] || BELL_URL.soft;
    keepAlive.play().catch(() => {});
  }

  /* names the step on the lock screen; the no-op handlers stop its transport
     controls from pausing the keep-alive out from under us */
  function setNowPlaying(title) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title });
    for (const action of ['play', 'pause']) {
      try { navigator.mediaSession.setActionHandler(action, () => {}); } catch (err) { /* unsupported */ }
    }
  }

  /* The runner plays a flat playlist; each entry remembers which component it
     came from, which is all the bells and the TOC need. */
  const runner = {
    open: false, playlist: [], i: 0,
    stepStart: 0, pausedAt: null, pausedMs: 0, paused: false,
    finished: false, ticker: null, wakeLock: null,
  };

  function buildPlaylist(program) {
    const items = [];
    (program.components || []).forEach((component, componentIdx) => {
      (component.steps || []).forEach((step, stepIdx) => {
        // null, zero and nonsense all mean the same thing: wait for *next*
        const duration = step.duration_s > 0 ? step.duration_s : null;
        items.push({ componentIdx, stepIdx, step, component, duration });
      });
    });
    return items;
  }

  async function takeWakeLock() {
    if (!navigator.wakeLock || !runner.open || runner.wakeLock) return;
    try {
      runner.wakeLock = await navigator.wakeLock.request('screen');
      runner.wakeLock.addEventListener('release', () => { runner.wakeLock = null; });
    } catch (err) { /* unsupported or denied — the countdown still runs */ }
  }

  /* The TOC is built once per program and then only restyled, so its own scroll
     position survives every step change and can follow the current entry. */
  let tocSteps = [];

  function buildToc() {
    const built = stepListNode(runner.playlist, { onPick: goTo });  // jumping never bells
    runnerToc.replaceChildren(built.node);
    tocSteps = built.rows;
  }

  function syncToc() {
    tocSteps.forEach((btn, i) => {
      btn.classList.toggle('current', i === runner.i && !runner.finished);
      btn.classList.toggle('done', i < runner.i || runner.finished);
    });
    tocToggle.textContent = (runner.i + 1) + ' / ' + runner.playlist.length;
    const current = tocSteps[runner.i];
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  /* One audio and one video element for the whole program, woken on the start
     tap: iOS only lets a media element start from inside a user gesture, so a
     fresh element on step 4 would never play. Untested — nothing seeded uses it. */
  let mediaEls = null;

  function ensureMediaElements() {
    if (mediaEls) return;
    const audio = document.createElement('audio');
    const video = document.createElement('video');
    for (const el of [audio, video]) {
      el.controls = true;
      el.playsInline = true;
      el.src = silenceUrl;   // Safari plays an audio-only source in a video element
      const started = el.play();
      if (started) started.then(() => el.pause(), () => {});
    }
    mediaEls = { audio, video };
  }

  function renderMedia(media) {
    for (const el of runnerMedia.children) if (el.pause) el.pause();
    runnerMedia.replaceChildren();
    if (!media || !media.src) return;
    if (mediaEls && (media.type === 'audio' || media.type === 'video')) {
      const el = mediaEls[media.type];
      el.src = media.src;
      runnerMedia.appendChild(el);
      const started = el.play();
      if (started) started.catch(() => {});   // the controls are right there
      return;
    }
    const img = document.createElement('img');
    img.alt = '';
    img.src = media.src;
    runnerMedia.appendChild(img);
  }

  function renderHint() {
    const item = runner.playlist[runner.i];
    if (runner.finished) runnerHint.textContent = 'done — end to return';
    else if (runner.paused) runnerHint.textContent = 'tap the center to resume';
    else if (item && item.duration == null) runnerHint.textContent = 'next when ready';
    else runnerHint.textContent = 'tap the center to pause';
    pauseBtn.textContent = runner.paused ? 'resume' : 'pause';
  }

  function renderStep() {
    const item = runner.playlist[runner.i];
    if (!item) return;
    runnerMain.classList.toggle('sit-step', item.component.kind !== 'warmup');
    renderMedia(item.step.media);
    // A one-step sit keeps the bare countdown; anything with parts names them.
    const named = item.component.kind === 'warmup' || (item.component.steps || []).length > 1;
    runnerTitle.textContent = named ? (item.step.title || '') : '';
    setNowPlaying(item.step.title || item.component.name || 'Sit');
    paintIntention();
    renderHint();
  }

  function goTo(i) {
    if (i < 0 || i >= runner.playlist.length) return;
    runner.i = i;
    runner.finished = false;
    runner.stepStart = Date.now();
    runner.pausedMs = 0;
    runner.pausedAt = runner.paused ? Date.now() : null;
    renderStep();
    syncToc();
    tickRunner();
  }

  function stepElapsed() {
    const now = runner.pausedAt === null ? Date.now() : runner.pausedAt;
    return Math.max(0, now - runner.stepStart - runner.pausedMs);
  }

  function paintCountdown() {
    const item = runner.playlist[runner.i];
    if (!item) return;
    if (runner.finished) { countdown.textContent = '0:00'; return; }
    const total = item.duration;
    if (total == null) { countdown.textContent = '—'; return; }
    renderCountdown(Math.max(0, Math.ceil((total * 1000 - stepElapsed()) / 1000)));
  }

  /* Wall clock, recomputed from Date.now() — a backgrounded tab doesn't drift.
     A tab away for minutes crosses every boundary it slept through: each step
     starts where the last one ended, never at "now", so the overshoot carries
     instead of being handed back as free time. The bells of a crossing collapse
     into one — a tab that slept through nine steps shouldn't ring nine times. */
  function tickRunner() {
    if (!runner.playlist.length) return;
    const fromIdx = runner.i, wasFinished = runner.finished;
    let soft = false, long = false;

    while (!runner.finished) {
      const item = runner.playlist[runner.i];
      const total = item.duration;
      if (total == null) break;                 // manual advance: waits for next
      if (stepElapsed() < total * 1000) break;

      const next = runner.playlist[runner.i + 1];
      const own = item.step.bell || 'soft';
      if (!next || next.componentIdx !== item.componentIdx || own === 'long') long = true;
      else if (own !== 'none') soft = true;

      if (!next) { runner.finished = true; break; }
      runner.stepStart += total * 1000 + runner.pausedMs;
      runner.pausedMs = 0;
      runner.i++;
    }

    if (long) bell('long');
    else if (soft) bell('soft');

    if (runner.i !== fromIdx) renderStep();
    if (runner.i !== fromIdx || runner.finished !== wasFinished) { syncToc(); renderHint(); }
    paintCountdown();
  }

  function togglePause() {
    if (!runner.open || runner.finished) return;
    if (runner.paused) {
      runner.pausedMs += Date.now() - runner.pausedAt;
      runner.pausedAt = null;
      runner.paused = false;
    } else {
      runner.pausedAt = Date.now();
      runner.paused = true;
    }
    renderHint();
    tickRunner();
  }

  function openRunner(sitMsg) {
    const playlist = buildPlaylist(programOf(sitMsg));
    if (!playlist.length) return;
    pausePlayer();       // the runner owns the audio from here
    clearInterval(runner.ticker);
    Object.assign(runner, {
      open: true, playlist, i: 0, paused: false, pausedAt: null, pausedMs: 0,
      finished: false,
    });
    playSilence();       // inside the start tap: iOS grants playback only here
    ensureMediaElements();
    takeWakeLock();
    streamIntention(sitMsg);   // prefetch: ready by the time the sit step arrives
    overlay.classList.add('on');
    buildToc();
    goTo(0);
    runner.ticker = setInterval(tickRunner, 250);
  }

  function endRunner() {
    clearInterval(runner.ticker);
    runner.ticker = null;
    runner.open = false;
    if (intentionAbort) intentionAbort.abort();
    if (runner.wakeLock) { runner.wakeLock.release(); runner.wakeLock = null; }
    // the shared elements outlive the overlay, so silence them on the way out
    for (const el of [keepAlive, mediaEls && mediaEls.audio, mediaEls && mediaEls.video]) {
      if (!el) continue;
      el.pause();
      el.removeAttribute('src');
      el.load();
    }
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
    runnerToc.classList.remove('open');
    overlay.classList.remove('on');
  }

  runnerStage.addEventListener('click', e => {
    if (e.target.closest('#runner-media')) return;   // native audio/video controls
    togglePause();
  });
  document.getElementById('rn-prev').addEventListener('click', () => goTo(runner.i - 1));
  document.getElementById('rn-next').addEventListener('click', () => goTo(runner.i + 1));
  pauseBtn.addEventListener('click', togglePause);
  document.getElementById('rn-end').addEventListener('click', endRunner);
  tocToggle.addEventListener('click', () => runnerToc.classList.toggle('open'));

  // on mobile the TOC is a sheet: picking a step or tapping past the list closes it
  runnerToc.addEventListener('click', () => runnerToc.classList.remove('open'));

  document.addEventListener('keydown', e => {
    if (!runner.open) return;
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(runner.i + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(runner.i - 1);
    else if (e.key === 'Escape') endRunner();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !runner.open) return;
    takeWakeLock();
    tickRunner();   // catch up on every boundary crossed while we were away
  });

  init();
</script>
</body>
</html>
